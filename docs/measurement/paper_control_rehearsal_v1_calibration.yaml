uniform_remediation_rule:
  selection_unit: manifest-target
  select_when: any axis in the target has largest-effect worst-repeat t_score > -20
  adjustment: retain the first two effect points and double only the largest effect
  shared_harness_effect_policy: >-
    A manifest target with multiple harnesses has one shared effect ladder, so
    selecting any axis updates the largest effect for all harnesses in that target.
  thresholds_unchanged: true
  counts_unchanged: true
  seeds_unchanged: true
  repeats_unchanged: true


null_control_correction:
  applies_to: all A/A and setup-placebo controls in every V10 component
  old_rehearsal_ceiling_exclusive: 3.5
  new_rehearsal_ceiling_exclusive: 4.5
  final_ceiling_exclusive: 4.5
  final_aa_max_failures: 0
  null_tests_per_rehearsal: 168
  rationale: >-
    A null t statistic is not a monotone power or headroom measure. Reusing the
    same manifest seeds also reuses the label and pool schedule, so the two
    operational runs are not independent null draws. Applying an extra 3.5
    per-test cutoff over 168 null checks creates avoidable family-wise rejection
    and encourages rerun-until-pass selection. V3 therefore uses the unchanged
    final 4.5 validity limit and zero-failure budget for both null controls.
  counts_unchanged: true
  seeds_unchanged: true
  repeats_unchanged: true
  final_threshold_unchanged: true

fast_positive_control_rule:
  selection_unit: manifest-target
  select_when: the first two positive control effects are exactly 64 and 512 ticks
  adjustment: retain 64 and 512 and set the largest effect to 16384 ticks
  applies_without_failed_target_selection: true
  largest_positive_rehearsal_t_ceiling_inclusive: -15.0
  final_positive_abs_t_threshold: 10.0
  counts_unchanged: true
  seeds_unchanged: true
  repeats_unchanged: true
  final_threshold_unchanged: true


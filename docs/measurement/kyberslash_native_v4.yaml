    timeout: 900
  - id: pqclean_mlkem768_kyberslash
    family: ML-KEM/KyberSlash1+2-fixed-sk-chosen-ct
    config: examples/pqc_mlkem768_kyberslash/ctkat_timing_v2.yaml

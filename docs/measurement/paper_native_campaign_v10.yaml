schema_version: 3
campaign_id: ctkat-paper-native-v10-single-host
status: premeasurement-frozen
frozen_at: "2026-08-14"

execution_policy:
  minimum_physical_hosts: 1
  minimum_distinct_cpu_models: 1
  operating_system: Linux
  architecture: x86_64
  virtualization_allowed: false
  emulation_allowed: false
  same_commit_required: true
  pilot_and_final_separated: true
  final_code_changes_allowed: false
  cross_component_artifact_reuse: false
  final_run_kind: final
  engineering_results_promotable: false
  pilot_results_promotable: false
  final_resume_allowed: false
  premeasurement_gate: automated-frozen-input-integrity
  independent_human_review_required: false
  cross_host_reproducibility_claimed: false
  required_clean_control_rehearsals: 2
  control_qualification_required: true
  require_smt_disabled: true
  require_turbo_disabled: true

components:
  - id: committed-corpus-refresh
    purpose: replace legacy timing rows without silently expanding corpus scope
    manifest: docs/measurement/native_timing_v5_campaign.yaml
    command: uv run --frozen python scripts/run_native_timing_campaign.py --manifest docs/measurement/native_timing_v5_campaign.yaml --output-root measurement_runs/host-ID/committed-corpus-v5 --run-kind final --final-gate single-host --control-qualification QUALIFICATION --cpu CPU-ID --execute
  - id: kyberslash-contrast
    purpose: fixed-key chosen-ciphertext contrasts and same-address vulnerable/patched operand canaries
    manifest: docs/measurement/kyberslash_native_v5.yaml
    command: uv run --frozen python scripts/run_native_timing_campaign.py --manifest docs/measurement/kyberslash_native_v5.yaml --output-root measurement_runs/host-ID/kyberslash-v5 --run-kind final --final-gate single-host --control-qualification QUALIFICATION --cpu CPU-ID --execute
  - id: falcon-contrast
    purpose: full-signature reference, native-FP, and integer-FPR comparison
    manifest: docs/measurement/falcon_native_v4.yaml
    command: uv run --frozen python scripts/run_native_timing_campaign.py --manifest docs/measurement/falcon_native_v4.yaml --output-root measurement_runs/host-ID/falcon-v4 --run-kind final --final-gate single-host --control-qualification QUALIFICATION --cpu CPU-ID --execute
  - id: diverse-lineages
    purpose: portable versus native profiles with an explicitly mixed ML-KEM valid-tuple axis
    manifest: docs/measurement/diverse_native_v4.yaml
    command: uv run --frozen python scripts/run_native_timing_campaign.py --manifest docs/measurement/diverse_native_v4.yaml --output-root measurement_runs/host-ID/diverse-v4 --run-kind final --final-gate single-host --control-qualification QUALIFICATION --cpu CPU-ID --execute

same_corpus_baseline:
  check_command: uv run --frozen python scripts/run_same_corpus_baselines.py --check
  execute_commands:
    official_dudect: uv run --frozen python scripts/run_same_corpus_baselines.py --run-dudect --run-kind final --final-gate single-host --control-qualification QUALIFICATION --cpu CPU-ID --output-root measurement_runs/host-ID/same-corpus
    timecop: uv run --frozen python scripts/run_same_corpus_baselines.py --run-timecop --run-kind final --final-gate single-host --control-qualification QUALIFICATION --prefix TIMECOP-PREFIX --output-root measurement_runs/host-ID/same-corpus
    microwalk_pin: uv run --frozen python scripts/run_same_corpus_baselines.py --run-microwalk --run-kind final --final-gate single-host --control-qualification QUALIFICATION --output-root measurement_runs/host-ID/same-corpus
  automatic_promotion: false

analysis:
  script: scripts/analyze_paper_native_results.py
  contract: docs/measurement/PAPER_NATIVE_ANALYSIS_V2.md
  mode: named-single-host
  command: uv run --frozen python scripts/analyze_paper_native_results.py --bundle BUNDLE.yaml --verification-commit COMMIT --output-root analysis/named --output-mode named
  primary_decision: valid-single-host-result
  holm_within_preregistered_family: true
  report_host_heterogeneity: false

upstream_freeze:
  mlkem-native:
    release: v1.3.0
    revision: 398050c877ff4353c96305c6434b63528accfc37
    tree_sha256: 101a2e35764993175c99dbbb7bb67c2f42970f525b0fd4493e5811eef162ec0a
  mldsa-native:
    release: v1.0.0-beta2
    revision: 9b0ee84f4cf399043eca59eca4e5f8531ca1d61b
    tree_sha256: a6899867ede95f0c5464c92b96ab314e83c610ff9e23c1cac6f3d78789e710ff

promotion:
  automatic_corpus_mutation: false
  require_artifact_hashes: true
  require_clean_frozen_commit: true
  require_automated_premeasurement_gate: true
  require_two_clean_control_rehearsals: true
  require_control_qualification_artifact: true
  require_two_person_human_review: false
  require_both_hosts: false
  require_single_physical_host: true
  require_control_pass: true
  preregistration: docs/measurement/EXPERIMENT_PREREGISTRATION.md
  control_calibration: docs/measurement/paper_control_rehearsal_v2_calibration.yaml
  control_rehearsal: docs/measurement/paper_control_rehearsal_v3.yaml

claim_limits:
  - a static plan or automated integrity gate is not timing evidence or independent human approval
  - an engineering or pilot run is not final evidence
  - single-host final evidence supports only host-scoped findings and does not establish cross-host reproducibility
  - no independent review, declassification, or inter-rater agreement claim is made
  - v6 final, pre-v7 engineering, failed v7 and v8 final attempts, v1 artifacts, and failed v2-a are diagnostic or calibration evidence and are not reusable in v10
  - v10 uses the unchanged final 4.5 null limit because null t has no monotone headroom interpretation
  - v10 assigns the same 16384-tick largest sentinel to every target whose first two effects are 64 and 512 without using reduced target statistics
  - every v10 final command requires a machine-validated qualification from two blocker-free v3 control rehearsals at the exact final commit
  - the two v3 clean runs are operational reruns and are not claimed as independent inferential replicates
  - every v10 native component and the same-corpus official dudect run require SMT and turbo disabled before sampling
  - v1 Falcon and diverse plus v2 committed-corpus engineering traces are calibration evidence and are not reusable in their replacement final campaigns
  - KyberSlash v2 operand traces have invalid-placebo and class-address setup confounds and are not reusable in v3, v4, or v5
  - every final timing axis requires a pre-measurement source, binary, compiler, config, and linked-input build seal
  - non-operand KEM and signature class setup uses dual-read-masked-select-v4 to read both pools and select into shared work buffers before timing
  - every resolved timing harness has an explicit semantic randomness policy independent of randombytes_header and runtime observations must match it
  - KyberSlash operand and c-fn-dsa harnesses require seeded-interpose despite a null randombytes_header
  - KyberSlash operand timing records zero RNG calls inside the measured decapsulation interval
  - only the deterministic self-contained toy baseline declares external-or-none randomness
  - the ML-KEM valid-tuple axis changes secret and public material together and cannot support secret attribution
  - chosen-ciphertext timing is a public-input contrast and not secret attribution
  - operand-bin timing is a hardware-latency canary and not a full attack or key recovery
  - full-signature Falcon timing includes variable-length encoding
  - c-fn-dsa is prospective comparator evidence, not a FIPS 206 conformance claim
  - OpenSSL is a provider-API integration case and not an independent lineage

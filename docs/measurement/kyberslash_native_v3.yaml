schema_version: "1.0"
campaign_id: kyberslash-native-v3
description: >-
  Fixed-secret-key, frozen public chosen-ciphertext full-ML-KEM contrasts plus
  paired direct numerator-bin vulnerable/patched canaries. The six operand
  canaries use the opt-in same-address-branchless-v3 setup, a valid coefficient
  1664 placebo path, all-bin untimed return-code witnesses, zero measured
  decapsulation failures, a linked wrapper-to-site call contract, and the common
  pre-measurement build seal. KyberSlash v2 operand traces are engineering-only:
  their invalid placebo and class-specific source addresses are disclosed setup
  confounds and no v2 trace may be reused here.
coverage_mode: manifest-only

host: &host
  system: Linux
  machines: [x86_64, AMD64]
  require_single_cpu_affinity: true
  reject_emulation: true
  reject_virtualization: true
  recommended_governor: performance

protocol: &protocol
  backend: official-dudect
  clock: rdtsc
  seed: 0xC0FFEE
  warmup: 1000
  batches: 10
  process_repeats: 3
  pool_size: 64
  aa_abs_t_limit: 4.5
  positive_abs_t_threshold: 10.0
  aa_max_failures: 0
  target_power: 0.80
  power_alpha: 0.01
  compiler: gcc
  compile_timeout: 600
  backend_timeout: 300

targets:
  - id: pqclean_mlkem768
    family: ML-KEM/KyberSlash-stock-fixed-sk-chosen-ct
    config: examples/pqc_mlkem768/ctkat_timing_kyberslash_v2.yaml
    harnesses: [kem_dec_chosen_ct]
    axes: {kem_dec_chosen_ct: chosen_ct}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash1
    family: ML-KEM/KyberSlash1-fixed-sk-chosen-ct
    config: examples/pqc_mlkem768_kyberslash1/ctkat_timing_v2.yaml
    harnesses: [kem_dec_chosen_ct]
    axes: {kem_dec_chosen_ct: chosen_ct}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash2
    family: ML-KEM/KyberSlash2-fixed-sk-chosen-ct
    config: examples/pqc_mlkem768_kyberslash2/ctkat_timing_v2.yaml
    harnesses: [kem_dec_chosen_ct]
    axes: {kem_dec_chosen_ct: chosen_ct}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash
    family: ML-KEM/KyberSlash1+2-fixed-sk-chosen-ct
    config: examples/pqc_mlkem768_kyberslash/ctkat_timing_v2.yaml
    harnesses: [kem_dec_chosen_ct]
    axes: {kem_dec_chosen_ct: chosen_ct}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900

  - id: kyberslash_operand_ks1_vulnerable
    family: KyberSlash1/direct-operand/vulnerable-v3
    config: examples/kyberslash_operand_latency/ctkat_ks1_vulnerable_v3.yaml

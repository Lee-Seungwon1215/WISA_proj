schema_version: "1.0"
campaign_id: kyberslash-native-v1
description: >-
  EXPLORATORY legacy stock/KS1/KS2/combined/historical ML-KEM-768 timing
  comparison. Its sk class changes both the secret key and matching public
  ciphertext, and its GCC -O2 cell strength-reduces the frozen KyberSlash
  divisions. It must not be promoted as KyberSlash leakage evidence; use v2.
coverage_mode: manifest-only

host: &host
  system: Linux
  machines: [x86_64, AMD64]
  require_single_cpu_affinity: true
  reject_emulation: true
  reject_virtualization: true
  recommended_governor: performance

protocol: &protocol
  backend: official-dudect
  clock: rdtsc
  seed: 0xC0FFEE
  warmup: 1000
  batches: 10
  process_repeats: 3
  pool_size: 64
  aa_abs_t_limit: 4.5
  positive_abs_t_threshold: 10.0
  aa_max_failures: 0
  target_power: 0.80
  power_alpha: 0.01
  compiler: gcc
  compile_timeout: 600
  backend_timeout: 300

targets:
  - id: pqclean_mlkem768
    family: ML-KEM/KyberSlash-control
    config: examples/pqc_mlkem768/ctkat.yaml
    harnesses: [kem_dec, kem_dec_ct, kem_dec_fo]
    axes: {kem_dec: sk, kem_dec_ct: ct, kem_dec_fo: fo}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash1
    family: ML-KEM/KyberSlash1
    config: examples/pqc_mlkem768_kyberslash1/ctkat_timing.yaml
    harnesses: [kem_dec]
    axes: {kem_dec: sk}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash2
    family: ML-KEM/KyberSlash2
    config: examples/pqc_mlkem768_kyberslash2/ctkat_timing.yaml
    harnesses: [kem_dec]
    axes: {kem_dec: sk}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqclean_mlkem768_kyberslash
    family: ML-KEM/KyberSlash1+2
    config: examples/pqc_mlkem768_kyberslash/ctkat_timing.yaml
    harnesses: [kem_dec]
    axes: {kem_dec: sk}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900
  - id: pqcrystals_kyber768_ref_a621b8d
    family: Kyber/historical-vulnerable
    config: examples/pqc_kyber768_historical/ctkat_timing.yaml
    harnesses: [kem_dec]
    axes: {kem_dec: sk}
    target_measurements: 30000
    control_measurements: 10000
    positive_control_effects: [64, 512, 4096]
    timeout: 900

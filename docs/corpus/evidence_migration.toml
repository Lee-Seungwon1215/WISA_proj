schema_version = "2.0"
source_schema_version = "1.2"
default_correctness = "not-run"
default_timing_validity = "insufficient-power"
default_timing_backend = "experimental-first-order-v1"
# V1 cells predate asm_status. The frozen refresh recipe requested gcc+clang
# across the recorded opt matrix; an empty asm_error is therefore migrated as
# PASS only for this archive. New v2 producers require an explicit coverage
# manifest and emit NOT_RUN when a compiler/opt was not scanned.
legacy_asm_cell_policy = "assume-scanned-unless-error"

# v1 basis=review never migrates to review=reviewed by implication. Each final
# state below names a checked, versioned artifact. Rows not listed here remain
# pending (basis=review/stop) or not-needed (basis=auto).


    template: kem
    summary_harnesses: [kem_dec, kem_dec_fo]
  - id: pqclean_mlkem768
    config: examples/pqc_mlkem768/ctkat.yaml
    source_harness: kem_dec
    template: kem
    summary_harnesses: [kem_dec, kem_dec_ct, kem_dec_fo]
  - id: pqclean_mlkem1024
    config: examples/pqc_mlkem1024/ctkat.yaml
    source_harness: kem_dec
    template: kem
    summary_harnesses: [kem_dec, kem_dec_fo]
  - id: pqclean_mldsa44
    config: examples/pqc_mldsa44/ctkat.yaml
    source_harness: sign
    template: sign
    summary_harnesses: [sign]
  - id: pqclean_mldsa65
    config: examples/pqc_mldsa65/ctkat.yaml
    source_harness: sign
    template: sign
    summary_harnesses: [sign]
  - id: pqclean_mldsa87
    config: examples/pqc_mldsa87/ctkat.yaml
    source_harness: sign
    template: sign
    summary_harnesses: [sign]
  - id: pqclean_sphincs_sha2_128f_simple

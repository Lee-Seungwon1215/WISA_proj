schema_version: 1
snapshot_id: ctkat-corpus-correctness-v1
status: deterministic-api-roundtrip-frozen
compiler:
  cc: gcc
  cflags: [-O2, -g, -fno-omit-frame-pointer, -fno-lto]
randomness: generated-deterministic-PQCLEAN_randombytes-test-interpose

targets:

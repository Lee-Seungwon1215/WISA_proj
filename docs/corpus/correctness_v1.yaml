    source_harness: sign
    template: sign
    summary_harnesses: [sign]
  - id: pqclean_falcon512_reference
    config: examples/pqc_falcon512/ctkat.yaml
    source_harness: sign
    template: sign
    summary_harnesses: [sign]
  - id: pqclean_falcon1024_reference
    config: examples/pqc_falcon1024/ctkat.yaml
    source_harness: sign
    template: sign
    summary_harnesses: [sign]

snapshot: docs/corpus/correctness_snapshot_v1.json

build_contract:
  operating_system: Linux
  architectures:
    x86_64:
      github_runner: ubuntu-24.04
      native_profile: x86_64-optimized
      force_macros: [MLK_FORCE_X86_64, MLD_FORCE_X86_64]
      required_cpu_features: [avx2, bmi2]
      asm_symbol_suffix: avx2_asm
      instruction_markers: [vpxor, vpmullw, vpmulld]
    aarch64:
      github_runner: ubuntu-24.04-arm
      native_profile: aarch64-optimized
      force_macros: [MLK_FORCE_AARCH64, MLD_FORCE_AARCH64]
      required_cpu_features: []
      asm_symbol_suffix: aarch64_asm
      instruction_markers: [sqrdmulh, smull, umull]
  profiles: [portable, architecture-native]
  portable_definition: >-
    Native arithmetic and FIPS202 backends are disabled and the monolithic
    assembly unit is not linked. Generic compiler/inline-assembly value
    barriers and secure zeroization remain enabled; CONFIG_NO_ASM is not a
    synonym for the portable cryptographic backend.
  compilers: [gcc, clang]
  optimizations:
    debug: [-O0, -g3]
    O1: [-O1]
    O2: [-O2]
    O3: [-O3]
    Os: [-Os]
  expected_cells_per_architecture: 120
  expected_cells_all_architectures: 240
  execution: every-cell-deterministic-smoke
  equivalence: every-parameter-profile-compiler-optimization-transcript
  upstream_kat:
    execution_cells: gcc-O2-portable-and-architecture-native
    expected_checks_per_architecture: 12
    digest_source: imported-META.yml
  structural:
    portable_forbids_native_asm_symbols: true
    optimized_requires_native_asm_symbols: true
    optimized_requires_architecture_instruction_marker: true
    artifact_machine_header_required: true
  timing_evidence: false

same_corpus_mapping:
  mlkem-native:

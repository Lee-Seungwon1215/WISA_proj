scope:
  - preservation of the frozen V10 single-host measurement identity and host bundle
  - rejection of incomplete, fabricated, stale, or mismatched native analysis at publication time
  - closure of the complete-result render, clean-room package, and remaining external archive boundary
findings:
  - finding_id: aiv10p-001
    severity: critical
    title: Physical evidence could lose its frozen source and host provenance
    description: Final evidence must remain bound to the frozen measurement commit, one physical host, its qualification reports, and the preserved aggregate hash tree.
    evidence_ids: [aiv10p-plan, aiv10p-native-runner, aiv10p-bundle]
  - finding_id: aiv10p-002
    severity: critical
    title: A publication renderer could silently accept synthetic or mismatched results
    description: The paper path must reject wrong schemas, axis drift, commit drift, incomplete identities, inconsistent counts, stale generated files, and absolute local paths.
    evidence_ids: [aiv10p-renderer, aiv10p-checker, aiv10p-tests, aiv10p-runbook]
  - finding_id: aiv10p-003
    severity: high
    title: Complete derived results could be detached from their verified input and archive boundary
    description: The publication state must bind the analysis hash and bundle identity, reproduce generated bytes, and distinguish a verified draft source package from the still-pending public raw archive DOI.
    evidence_ids: [aiv10p-render-state, aiv10p-native-results, aiv10p-post-plan, aiv10p-package]
dispositions:
  - finding_id: aiv10p-001
    status: addressed
    rationale: The runner and bundle builder independently bind the frozen commit, qualification sources, host identity, component reports, and aggregate hashes before promotion.
    blocker: ""
    evidence_ids: [aiv10p-plan, aiv10p-native-runner, aiv10p-bundle]
  - finding_id: aiv10p-002
    status: addressed
    rationale: The deterministic renderer and fail-closed checker require the exact named-analysis contract and are covered by acceptance, mutation, stale-output, and path-leakage tests.
    blocker: ""
    evidence_ids: [aiv10p-renderer, aiv10p-checker, aiv10p-tests, aiv10p-runbook]
  - finding_id: aiv10p-003
    status: accepted-with-blocker
    rationale: The tracked render state binds the complete analysis byte hash, bundle ID, aggregate input hash, frozen commit, and 28-axis state, and the draft source package rebuilds in a clean temporary tree. Public deposition is external to the repository and strict mode correctly refuses to represent it as complete.
    blocker: Deposit the complete raw and derived V10 artifact archive, record its stable DOI or permanent URL and archive SHA-256, then replace the intentional data-availability placeholder before submission.
    evidence_ids: [aiv10p-render-state, aiv10p-native-results, aiv10p-post-plan, aiv10p-package, aiv10p-checker]

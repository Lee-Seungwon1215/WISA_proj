    status: addressed
    rationale: Falcon V3 doubles the Falcon-1024 reference largest effect to 131072 ticks while preserving the two lower points, counts, seeds, repeats, thresholds, sources, compiler, and harness contract; two fresh V2 rehearsals must still pass before final launch.
    blocker: ""
    evidence_ids: [shv9-calibration, shv9-falcon, shv9-profile, shv9-prereg]
  - finding_id: shv9-002
    status: addressed
    rationale: One control-only rule is applied to every manifest target and therefore also selects Falcon-512 reference and c-fn-dsa-512 integer-FPR headroom cases; the checker rejects all undeclared effect or non-effect changes.
    blocker: ""

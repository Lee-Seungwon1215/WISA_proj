  - finding_id: shv9-003
    status: addressed
    rationale: Falcon V3 and diverse V3 are predecessor-identical outside declared positive effects, the comparator checker remains closed over six binary contracts, and analysis retains variable-length full-signature and non-conformance wording.
    blocker: ""
    evidence_ids: [shv9-falcon, shv9-diverse, shv9-falcon-checker, shv9-analysis, shv9-claims]

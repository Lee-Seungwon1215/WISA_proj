    evidence_ids: [shv9-calibration, shv9-checker, shv9-config-tests]
  - finding_id: shv9-003
    severity: high
    title: Control-effect changes must not weaken full-signature semantics
    description: V9 must retain signature verification, return-code and output-length witnesses, runtime randomness, build seals, linked-binary contracts, and the prohibition on FIPS 206 conformance claims.
    evidence_ids: [shv9-falcon, shv9-diverse, shv9-falcon-checker, shv9-claims]
  - finding_id: shv9-004
    severity: high
    title: Fresh signature control headroom and target evidence are pending
    description: Static and regression evidence cannot demonstrate that the selected native host yields two blocker-free signature rehearsals or promotion-ready final axes.
    evidence_ids: [shv9-profile, shv9-falcon, shv9-diverse]
dispositions:

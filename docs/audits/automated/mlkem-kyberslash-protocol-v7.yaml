  - finding_id: mkv10-002
    severity: high
    title: A uniform rule must cover every matching fast target and no others
    description: The V10 rule is defensible only if all and exactly the targets beginning with 64 and 512 ticks receive the same 16384-tick endpoint while every other field remains predecessor-identical.
    evidence_ids: [mkv10-core, mkv10-kyberslash, mkv10-diverse, mkv10-checker, mkv10-tests]
  - finding_id: mkv10-003
    severity: high
    title: Stronger sentinels do not strengthen leakage attribution
    description: Valid-tuple remains mixed public-and-secret input, chosen ciphertext remains public input, and operand-bin remains a hardware-latency canary rather than key recovery.
    evidence_ids: [mkv10-plan, mkv10-claims, mkv10-kyberslash]
  - finding_id: mkv10-004
    severity: high
    title: Fresh V10 ML-KEM and KyberSlash evidence is pending
    description: Static equality and calibration provenance cannot establish physical-host target or control outcomes.
    evidence_ids: [mkv10-profile, mkv10-core, mkv10-kyberslash]

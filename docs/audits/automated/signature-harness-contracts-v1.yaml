limitations:
  - This automated audit is not cryptographic approval of any public-state declassification.
  - Full-API signature timing includes encoding and randomness effects unless a separately frozen core harness is measured.
  - Directional positive-control power and its A/A-derived diagnostics do not bound an unobserved target effect or estimate achieved target power.
  - This audit checks Falcon v1-to-v2 signature and binary-contract invariance, not whether the recalibrated ladder achieves power; only fresh final controls can establish that.
  - The observed remote x86_64 full-link and sign-to-verify smoke is an unpreserved compile/correctness engineering witness only; it is not physical timing evidence, final-campaign evidence, or human-review credit.
  - Evidence hashes expire on any referenced-file change.
human_gate_effect: none

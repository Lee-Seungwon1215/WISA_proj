schema_version: "1.0"
audit_id: automated-signature-harness-contracts-v1
status: complete
title: Automated adversarial audit of signature timing harness and declassification contracts
perspective: signature-harness-contracts
automated_agent: true
human_reviewer: false
automated_agent_id: signature-falcon-audit
audited_at: "2026-08-08T07:36:15Z"
audited_commit: 762d0ce6c0afe4f476e391f0337aba2623cabd84
scope:
  - detached-signature API return-code, length, and verification correctness gates
  - fixed versus bounded signature output contracts
  - signature timing physical controls, directional seeded-delay power gate, and sensitivity diagnostics
  - producer-versus-independent-verifier numeric serialization and raw-protocol binding
  - ML-DSA rejection-path and SPHINCS public-state declassification claims
  - Falcon and c-fn-dsa full-API timing scope and floating-point comparator evidence
  - duration-versus-output-length secondary analysis and human review boundary
findings:
  - finding_id: shc-001
    severity: critical
    title: Signing failures could be reported as valid timing rows
    description: The timing harness computed the signing return code but ignored it, returned success, and did not verify that the measured API produced a valid detached signature.
    evidence_ids: [shc-template, shc-parser, shc-cli]
  - finding_id: shc-002
    severity: critical
    title: Signature output-length contract was not fail closed
    description: Nonzero or malformed lengths could survive as paper-eligible rows and fixed versus bounded encodings were not distinguished per adapter.
    evidence_ids: [shc-template, shc-parser, shc-cli]
  - finding_id: shc-003
    severity: critical
    title: ML-DSA rejection-path declassification exceeded the final public transcript
    description: Rejected iterations depend on secret polynomial state that does not enter the final signature, so the prior broad public-output argument was unsound.
    evidence_ids: [shc-variable-time, shc-review-packet]
  - finding_id: shc-004
    severity: high
    title: Falcon pairwise and duration-length secondary analyses were not implemented
    description: The preregistration promised length association and multiplicity-adjusted comparator contrasts but only min/max/unique length summaries existed.
    evidence_ids: [shc-analysis]
  - finding_id: shc-005
    severity: high
    title: SPHINCS declassification and Falcon floating-point evidence remain incomplete
    description: Source arguments existed without a fully bound native probe for every claimed path and without exact measured-binary FP evidence on both hosts.
    evidence_ids: [shc-variable-time, shc-review-packet]
  - finding_id: shc-006
    severity: critical
    title: Automated signature review cannot approve the human declassification packet
    description: Correct code and an automated adversarial pass do not replace two independent humans reviewing the exact source revision and evidence hashes.
    evidence_ids: [shc-review-packet]
  - finding_id: shc-007
    severity: critical
    title: Falcon measured-binary instruction claims could be self-attested
    description: A backend report could claim the expected native-FP or software-FPR instruction profile while preserving only derived counts or stale disassembly rather than freshly reproducing the exact linked binary.
    evidence_ids: [shc-binary-contract, shc-falcon-contracts, shc-binary-tests]
  - finding_id: shc-008
    severity: high
    title: Integral control means could make valid signature artifacts unverifiable
    description: The producer serialized timing means from float samples while the independent protocol parser restored integer cycle counts; an exactly integral mean was then misclassified as an integer schema field and rejected despite numerical equality.
    evidence_ids: [shc-cli, shc-dudect-verifier, shc-native-tests]
  - finding_id: shc-009
    severity: critical
    title: Positive-control power accepted effects in the wrong direction
    description: Counting only absolute t-score exceedances allowed a reversed class-0-slower effect to satisfy the sensitivity gate even though the seeded control contract injects a class-1 delay.
    evidence_ids: [shc-cli, shc-dudect-verifier, shc-control-tests, shc-native-tests, shc-timing-contract]
  - finding_id: shc-010
    severity: medium
    title: Sensitivity output did not quantify the actual directional positive-control gate
    description: The existing alpha-based A/A nominal-sensitivity field did not report the effect implied by the frozen positive t threshold and target-power rule, which could mislead experiment planning if treated as the gate's detectable effect.
    evidence_ids: [shc-cli, shc-dudect-verifier, shc-control-tests, shc-native-tests, shc-timing-contract]
dispositions:
  - finding_id: shc-001
    status: addressed
    rationale: Every signature row records signature_return_code, any nonzero call invalidates the trace, and an untimed sign-then-verify gate must pass before measurement.
    blocker: ""
    evidence_ids: [shc-template, shc-parser, shc-cli]
  - finding_id: shc-002
    status: addressed
    rationale: Each adapter declares fixed or bounded output length; parser, runtime metadata, backend protocol, and native campaign validator independently reject contract failures.
    blocker: ""
    evidence_ids: [shc-template, shc-parser, shc-cli]
  - finding_id: shc-003
    status: addressed
    rationale: The source policy and paper packet now keep secret-dependent ML-DSA rejection paths in needs-analysis and limit any public declassification to exact successful final-transcript paths.
    blocker: ""
    evidence_ids: [shc-variable-time, shc-review-packet]
  - finding_id: shc-004
    status: addressed
    rationale: The two-host analyzer computes output-length association, repeat-level comparator contrasts, family-local Holm adjustment, and explicit host heterogeneity without overriding primary findings.
    blocker: ""
    evidence_ids: [shc-analysis]
  - finding_id: shc-005
    status: accepted-with-blocker
    rationale: Exact linked-binary contracts and fresh objdump reproduction make the engineering harness safe to execute, but unmeasured native SPHINCS and Falcon comparator claims remain blocked from final promotion.
    blocker: Produce exact native evidence for each SPHINCS public-state claim and bind Falcon/c-fn-dsa FP audits to the measured binaries on both hosts, then obtain human review.
    evidence_ids: [shc-variable-time, shc-review-packet]
  - finding_id: shc-006
    status: accepted-with-blocker
    rationale: The automated audit is deliberately stored outside docs/reviews and grants no human-review credit.
    blocker: Two independent humans must complete the signature declassification packet at the frozen review commit and evidence manifest hash.
    evidence_ids: [shc-review-packet]
  - finding_id: shc-007
    status: addressed
    rationale: The validator hashes the measured binary and generated/linked sources, verifies the exact compiler and objdump executables, reparses preserved disassembly, reruns objdump over the preserved binary, and compares the fresh semantic observations and canonical transcript.
    blocker: ""
    evidence_ids: [shc-binary-contract, shc-falcon-contracts, shc-binary-tests]
  - finding_id: shc-008
    status: addressed
    rationale: The independent verifier now normalizes recomputed statistical means to floats while retaining strict integer typing for counts and seeds; the campaign regression exercises the exact integral-mean JSON round trip.
    blocker: ""
    evidence_ids: [shc-dudect-verifier, shc-native-tests]
  - finding_id: shc-009
    status: addressed
    rationale: Both the producer and independent verifier now require mean_delta greater than zero and t_score at or below the negative frozen threshold; focused tests reject reversed and sub-threshold controls, and the frozen contract documents the direction.
    blocker: ""
    evidence_ids: [shc-cli, shc-dudect-verifier, shc-control-tests, shc-native-tests, shc-timing-contract, shc-native-campaign]
  - finding_id: shc-010
    status: addressed
    rationale: Producer and verifier now record and independently reconstruct positive_detection_effects_at_target_power as (positive_abs_t_threshold + z(target_power)) times the A/A standard error, separately from the legacy alpha-based nominal diagnostic and without treating either value as a target-effect bound.
    blocker: ""
    evidence_ids: [shc-cli, shc-dudect-verifier, shc-control-tests, shc-native-tests, shc-timing-contract]

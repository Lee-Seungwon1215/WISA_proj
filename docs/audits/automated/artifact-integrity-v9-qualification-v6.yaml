scope:
  - exact-commit two-rehearsal qualification before every V9 final component or baseline
  - qualification and source-report preservation inside the single-host hashed artifact tree
  - fresh-root non-reuse boundary for failed V8 and diagnostic V1 rehearsal artifacts
findings:
  - finding_id: aiv9-001
    severity: critical
    title: A self-declared qualification could bypass the physical control evidence
    description: A final launcher must not trust a ready boolean without reopening both source reports and checking their hashes, run identities, profile, calibration, commit, and blocker-free summaries.
    evidence_ids: [aiv9-native-runner, aiv9-rehearsal, aiv9-profile, aiv9-schema]
  - finding_id: aiv9-002
    severity: high
    title: Qualification provenance could disappear when the final host tree is transferred
    description: Absolute machine-local paths in a launch gate are not archival evidence unless the qualification and both source reports are also retained under the host hash manifest.
    evidence_ids: [aiv9-bundle, aiv9-analysis, aiv9-bundle-tests]
  - finding_id: aiv9-003
    severity: high
    title: V9 physical qualification and final evidence do not yet exist
    description: Source, tests, and completed V1 diagnostics cannot establish that two fresh V2 rehearsals or the final campaign pass on the native host.
    evidence_ids: [aiv9-plan, aiv9-contract, aiv9-prereg]
dispositions:
  - finding_id: aiv9-001
    status: addressed
    rationale: Every V9 final command requires one qualification path, and the final gate reopens the qualification plus both regular source reports, verifies exact hashes and distinct run IDs, requires the same clean commit and current profile/calibration hashes, and checks the complete blocker-free summary before sampling.
    blocker: ""
    evidence_ids: [aiv9-plan, aiv9-native-runner, aiv9-rehearsal, aiv9-profile, aiv9-schema]
  - finding_id: aiv9-002
    status: addressed
    rationale: The operator contract places V2 reports and qualification below measurement_runs/host-a; the bundle builder requires those exact files inside the host root, and named analysis requires their three hashes to occur uniquely in the verified SHA256SUMS tree.
    blocker: ""
    evidence_ids: [aiv9-contract, aiv9-bundle, aiv9-analysis, aiv9-bundle-tests]
  - finding_id: aiv9-003
    status: accepted-with-blocker
    rationale: The audited commit is deliberately premeasurement and labels every rehearsal non-promotable.
    blocker: Execute two distinct blocker-free V2 rehearsals at this exact commit, create and retain their qualification, then execute all seven fresh V9 final commands and assembly evidence before building the host bundle.
    evidence_ids: [aiv9-plan, aiv9-contract, aiv9-prereg]

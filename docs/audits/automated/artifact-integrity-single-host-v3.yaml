    evidence_ids: [abi7-runner, abi7-preregistration]
  - finding_id: abi7-003
    severity: high
    title: No fresh v7 final artifact exists at the audited commit
    description: Calibration and static verification establish readiness but are not paper timing evidence.
    evidence_ids: [abi7-plan, abi7-claim-matrix]
dispositions:
  - finding_id: abi7-001
    status: addressed
    rationale: V7 requires one clean commit, fresh output roots, unique run IDs, and rejects cross-component artifact reuse; the bundle builder also requires every report to share the exact commit and host identity.
    blocker: ""
    evidence_ids: [abi7-plan, abi7-bundle-builder, abi7-analysis]
  - finding_id: abi7-002
    status: addressed
    rationale: The single-host gate now hashes ctkat/cli.py, all three timing-v2 templates, the toy config and implementation, the baseline manifest, runners, analyzers, schemas, and locks while also binding the full clean git commit.
    blocker: ""
    evidence_ids: [abi7-runner, abi7-plan]
  - finding_id: abi7-003
    status: accepted-with-blocker
    rationale: The audited tree is deliberately premeasurement and makes no empirical v7 timing claim.
    blocker: Execute all 28 axes, three same-corpus tools, fresh assembly evidence, schema-v5 bundle, and deterministic named analysis at one post-audit clean commit.
    evidence_ids: [abi7-plan, abi7-claim-matrix]

  - complete six-axis Falcon and four-axis diverse result presentation
findings:
  - finding_id: shv10p-001
    severity: critical
    title: Publication changes could erase signature harness semantics
    description: Full-signature verification, variable-length output, comparator status, and the no-FIPS-conformance boundary must survive from frozen profiles to the manuscript.
    evidence_ids: [shv10p-falcon, shv10p-diverse, shv10p-claims, shv10p-manuscript]
  - finding_id: shv10p-002
    severity: high
    title: Result aggregation could omit signature axes or overstate the measured path
    description: The renderer must require all six Falcon axes and four diverse axes and preserve per-axis classifications and output-length diagnostics.
    evidence_ids: [shv10p-renderer, shv10p-manuscript, shv10p-checker, shv10p-tests]
  - finding_id: shv10p-003
    severity: high
    title: Output-length analysis could be omitted or used to declassify full-signature timing
    description: All thirteen signature-length endpoints, including variable-length PQClean Falcon outputs, must remain secondary and cannot override the six Falcon and signature primary states.
    evidence_ids: [shv10p-native-results, shv10p-manuscript, shv10p-renderer]
  - finding_id: shv10p-004
    severity: medium
    title: Automated closure cannot replace the authors' final signature-claim review
    description: Contract, inventory, and wording checks can prevent mechanical drift but cannot supply author or coauthor approval of the final Falcon and ML-DSA interpretation.
    evidence_ids: [shv10p-claims, shv10p-manuscript, shv10p-native-results]
dispositions:
  - finding_id: shv10p-001
    status: addressed
    rationale: Frozen profiles, the claim matrix, and manuscript retain correctness, output-length, comparator, and non-conformance boundaries without retuning signature effects.
    blocker: ""
    evidence_ids: [shv10p-falcon, shv10p-diverse, shv10p-claims, shv10p-manuscript]
  - finding_id: shv10p-002
    status: addressed
    rationale: Exact per-component counts and complete per-axis identities are mandatory in the renderer, while the manuscript checker and mutation tests reject omission and drift.
    blocker: ""
    evidence_ids: [shv10p-renderer, shv10p-manuscript, shv10p-checker, shv10p-tests]
  - finding_id: shv10p-003
    status: addressed
    rationale: The result tables include every Falcon and diverse primary axis plus all thirteen signature-length endpoints; prose reports the three variable-length endpoints with their bounded within-class correlation and explicitly prohibits secondary declassification.
    blocker: ""
    evidence_ids: [shv10p-native-results, shv10p-manuscript, shv10p-renderer, shv10p-tests]
  - finding_id: shv10p-004
    status: accepted-with-blocker
    rationale: The automated packet verifies the frozen evidence and scoped wording while explicitly granting no human-review credit.
    blocker: The authors or coauthors must read and approve the final signature-result claims and associated submission declarations before submission.
    evidence_ids: [shv10p-claims, shv10p-manuscript, shv10p-native-results]

schema_version: "1.0"
audit_id: automated-mlkem-kyberslash-protocol-v1
status: complete
title: Automated adversarial audit of ML-KEM attribution and KyberSlash timing protocol
perspective: mlkem-kyberslash-protocol
automated_agent: true
human_reviewer: false
automated_agent_id: mlkem-kyber-audit
audited_at: "2026-08-10T09:24:02Z"
audited_commit: 48791fc170e65bf117d029eae80bb3397e2198e5
scope:
  - same-corpus toy ML-KEM class axis and defined C arithmetic
  - exact-binary ML-KEM public instruction attribution
  - KyberSlash fixed-secret chosen-ciphertext contrast
  - direct vulnerable-versus-patched operand-bin latency canaries
  - compiler optimization and linked-binary div/idiv contracts
  - raw-derived directional positive-control detection and sensitivity diagnostics
  - cross-version isolation of the Falcon-only v3 protocol amendment
findings:
  - finding_id: mkp-001
    severity: critical
    title: Toy same-corpus class contract did not match its claimed secret axis
    description: The branch consumed ciphertext while the evidence narrative attributed it to a secret-key byte, and signed multiplication could overflow with undefined behavior.
    evidence_ids: [mkp-toy-source, mkp-baseline-manifest]
  - finding_id: mkp-002
    severity: critical
    title: Public ML-KEM instruction attribution lacked exact clean-head binary evidence
    description: Name-derived corpus rows could not substitute for complete source-by-compiler disassembly with raw content-addressed evidence.
    evidence_ids: [mkp-asm-checker]
  - finding_id: mkp-003
    severity: critical
    title: KyberSlash full-KEM class changed both secret key and matching ciphertext
    description: A timing difference could not be causally attributed to the secret, public transcript, or their interaction.
    evidence_ids: [mkp-v2-plan, mkp-v2-config]
  - finding_id: mkp-004
    severity: critical
    title: GCC O2 removed the division the v1 campaign intended to measure
    description: The old campaign could time a reciprocal-multiply binary while presenting it as a KyberSlash division contrast.
    evidence_ids: [mkp-v2-plan, mkp-binary-contract]
  - finding_id: mkp-005
    severity: high
    title: Native disassembly and two-host timing artifacts do not yet exist
    description: Frozen builders and contracts are preparation, not evidence that an affected CPU reproduced operand-dependent division latency.
    evidence_ids: [mkp-v2-doc, mkp-asm-checker]
  - finding_id: mkp-006
    severity: critical
    title: Official-dudect controls and power fields could be self-attested
    description: A structurally plausible backend JSON could claim passing A/A, placebo, positive controls, and protocol rows without independently recomputing every pinned statistic from the three raw CSV artifacts.
    evidence_ids: [mkp-dudect-producer, mkp-dudect-verifier, mkp-dudect-tests, mkp-producer-control-tests, mkp-control-tests]
  - finding_id: mkp-007
    severity: critical
    title: ASM evidence did not close dependency and rebuild provenance
    description: Object hashes alone could omit untracked include dependencies, compiler transcripts, schema drift, or an independent rebuild of the complete 660-cell matrix.
    evidence_ids: [mkp-asm-builder, mkp-asm-schema, mkp-asm-checker]
  - finding_id: mkp-008
    severity: critical
    title: TIMECOP final logs could be replaced by self-consistent synthetic evidence
    description: A fake ELF and matching hand-written logs could satisfy hash and classifier fields unless the final validator rebuilt the frozen source and reran the exact patched backend.
    evidence_ids: [mkp-baseline-runner, mkp-baseline-schema, mkp-baseline-tests]
  - finding_id: mkp-009
    severity: high
    title: Ciphertext mutation was mislabeled as a proved rejection path
    description: A nonzero bit mutation plus disagreement with the original encapsulated secret does not prove ML-KEM implicit rejection because a different valid ciphertext would also disagree.
    evidence_ids: [mkp-timing-template, mkp-v2-config, mkp-v2-doc]
  - finding_id: mkp-010
    severity: low
    title: A Falcon-only campaign amendment could silently drift unrelated ML-KEM protocols
    description: Replacing the top-level paper campaign for Falcon calibration would also require renewed ML-KEM and KyberSlash review if it changed either component manifest, their KEM timing templates, source/config trees, or linked-binary contracts.
    evidence_ids: [mkp-primary-plan, mkp-v2-plan, mkp-paper-v3, mkp-timing-template, mkp-timing-common, mkp-v2-config, mkp-binary-contract]
dispositions:
  - finding_id: mkp-001
    status: addressed
    rationale: The toy source now aligns its class-controlled operand with the declared axis and uses defined-width arithmetic; the same-corpus manifest binds the corrected case.
    blocker: ""
    evidence_ids: [mkp-toy-source, mkp-baseline-manifest]
  - finding_id: mkp-002
    status: accepted-with-blocker
    rationale: A fail-closed exact-binary evidence builder/checker and frozen compiler matrix now exist, but the required native raw artifact is deliberately absent before execution.
    blocker: Run the exact-clean-head ML-KEM assembly evidence campaign on native Linux x86_64, preserve its content-addressed raw disassembly, and have humans review the public attribution packet.
    evidence_ids: [mkp-asm-checker]
  - finding_id: mkp-003
    status: addressed
    rationale: V2 holds the secret key fixed, freezes paired public chosen-ciphertext pools, emits input digests, and limits the full-KEM result to a public chosen-input contrast.
    blocker: ""
    evidence_ids: [mkp-v2-plan, mkp-v2-config, mkp-v2-doc]
  - finding_id: mkp-004
    status: addressed
    rationale: V2 freezes GCC Os and rejects a timing binary unless exact target symbols contain the preregistered div/idiv count, with matched zero-division patched controls.
    blocker: ""
    evidence_ids: [mkp-v2-plan, mkp-binary-contract, mkp-v2-doc]
  - finding_id: mkp-005
    status: accepted-with-blocker
    rationale: The engineering protocol is complete enough to execute, while all result claims remain blocked until both native hosts produce valid artifacts.
    blocker: Execute vulnerable and patched canaries plus fixed-key public contrasts on both accepted CPU models; do not claim a full attack or key recovery.
    evidence_ids: [mkp-v2-plan, mkp-v2-doc]
  - finding_id: mkp-006
    status: addressed
    rationale: The independent verifier reparses calibration, target, and complete protocol CSVs, reconstructs all frozen seeds and 102 dudect tests, and recomputes every control, detection fraction, threshold-aligned sensitivity diagnostic, and timing-validity field. Positive controls now pass only when the raw class-1 delay has the preregistered positive mean delta and negative t-score direction; integral means are normalized to floats solely to match the producer's JSON number domain.
    blocker: ""
    evidence_ids: [mkp-dudect-producer, mkp-dudect-verifier, mkp-dudect-tests, mkp-producer-control-tests, mkp-control-tests]
  - finding_id: mkp-007
    status: addressed
    rationale: ASM bundles now pin the JSON Schema hash, full compiler identity/argv/transcripts, tracked dependency closure, exact objdump/nm bytes, and an isolated source rebuild for every required cell.
    blocker: ""
    evidence_ids: [mkp-asm-builder, mkp-asm-schema, mkp-asm-checker]
  - finding_id: mkp-008
    status: addressed
    rationale: Final TIMECOP validation checks tracked source and compiler bytes, rebuilds the canary and both harnesses in isolation, reruns the exact pinned Valgrind, and compares normalized findings and process outcomes with preserved raw logs.
    blocker: ""
    evidence_ids: [mkp-baseline-runner, mkp-baseline-schema, mkp-baseline-tests]
  - finding_id: mkp-009
    status: addressed
    rationale: Every FO and fixed-key chosen-ciphertext pool now has an untimed scheme-specific rkprf(z, ct) witness; measurement aborts unless decapsulation returns the exact independently computed rejection key.
    blocker: ""
    evidence_ids: [mkp-timing-template, mkp-v2-config, mkp-v2-doc]
  - finding_id: mkp-010
    status: addressed
    rationale: A direct 762d0ce-to-48791fc selected-path diff was empty. The native and KyberSlash manifest blobs remained af25ce7d7f3f8049445dc29b00ffc38b70806f84 and 4b4063a5be0548151afd6b5e1aca17e5f54e8830; timing_kem and timing_v2_common remained 90b9fd6a0dc831b22ab373e28b04e2f5ba022661 and 60f464933087f790b4ecef6cf0f013591aeff773. The pqc_mlkem768, three KyberSlash variant, and direct-operand source/config/contract trees were byte-identical at both commits. Paper campaign v3 still routes committed-corpus-refresh and kyberslash-contrast through the same native_timing_v2_campaign.yaml and kyberslash_native_v2.yaml manifests; only Falcon advances to v2.
    blocker: ""
    evidence_ids: [mkp-primary-plan, mkp-v2-plan, mkp-paper-v3, mkp-timing-template, mkp-timing-common, mkp-v2-config, mkp-binary-contract]

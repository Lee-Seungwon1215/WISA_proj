limitations:
  - This automated audit cannot establish public attribution or exploitability without human cryptographic review.
  - Chosen-ciphertext and direct-operand axes are intentionally not described as secret-key leakage or key recovery.
  - Integral-to-float normalization is representational only; finite statistics remain raw-derived and tolerance-checked, while degenerate non-finite control statistics fail closed.
  - Blob and tree identity proves protocol bytes were unchanged between the two audited commits; it does not replace final execution or human interpretation of ML-KEM/KyberSlash results.
  - Evidence hashes expire on any referenced-file change.
human_gate_effect: none

  - The valid-tuple contract authenticates the frozen mixed-input construction and provenance; it cannot separate secret-key cost from ciphertext, embedded public-key material, or their interaction.
  - KyberSlash v2 operand traces remain setup-confounded historical engineering evidence and cannot be promoted, repaired statistically, or reused by v3.
  - Source-level same-address preparation and controls do not establish a hardware effect; only fresh reviewed physical v3 runs can do so.

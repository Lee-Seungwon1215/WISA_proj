schema_version: "1.0"
audit_id: automated-mlkem-kyberslash-protocol-v1
status: complete
title: Automated adversarial audit of ML-KEM attribution and KyberSlash timing protocol
perspective: mlkem-kyberslash-protocol
automated_agent: true
human_reviewer: false
automated_agent_id: mlkem-kyber-audit
audited_at: "2026-08-10T11:42:40Z"
audited_commit: 55f1bf0f0eda949edd52cf36e04ca3a81de780ba
scope:
  - same-corpus toy ML-KEM class axis and defined C arithmetic
  - exact-binary ML-KEM public instruction attribution
  - committed-corpus v3 and diverse-lineage v2 replacement of legacy sk labels with valid_tuple
  - valid-tuple fixed-versus-fresh class construction, setup return codes, and untimed round-trip witnesses
  - strict per-trace input-contract reconstruction across producer, official verifier, campaign validator, and paper analyzer
  - nonreuse of disclosed diverse v1 and committed-corpus v2 engineering calibration artifacts
  - pending two-person human review of the mixed public-and-secret attribution boundary
  - KyberSlash fixed-secret chosen-ciphertext contrast and exact rejection witnesses
  - direct vulnerable-versus-patched operand-bin latency canaries and linked-binary div/idiv contracts
  - raw-derived directional controls, physical-host requirements, and two-host promotion boundary
findings:
  - finding_id: mkp-001
    severity: critical
    title: Toy same-corpus class contract did not match its claimed secret axis
    description: >-
      The branch consumed ciphertext while the evidence narrative attributed it
      to a secret-key byte, and signed multiplication could overflow with
      undefined behavior.
    evidence_ids: [mkp-toy-source, mkp-baseline-manifest]
  - finding_id: mkp-002
    severity: critical
    title: Public ML-KEM instruction attribution lacked exact clean-head binary evidence
    description: >-
      Name-derived corpus rows could not substitute for complete
      source-by-compiler disassembly with raw content-addressed evidence.
    evidence_ids: [mkp-asm-checker]
  - finding_id: mkp-003
    severity: critical
    title: KyberSlash full-KEM class changed both secret key and matching ciphertext
    description: >-
      A timing difference could not be causally attributed to the secret,
      public transcript, or their interaction.
    evidence_ids: [mkp-kyberslash-plan, mkp-kyberslash-config]
  - finding_id: mkp-004
    severity: critical
    title: GCC O2 removed the division the v1 campaign intended to measure
    description: >-
      The old campaign could time a reciprocal-multiply binary while presenting
      it as a KyberSlash division contrast.
    evidence_ids: [mkp-kyberslash-plan, mkp-binary-contract]
  - finding_id: mkp-005
    severity: high
    title: Fresh physical two-host ML-KEM and KyberSlash evidence does not yet exist
    description: >-
      Frozen builders, v3/v2 manifests, and validators are preparation. They do
      not show that either valid-tuple contrast or a KyberSlash operand-latency
      canary reproduced on two accepted native CPU models.
    evidence_ids: [mkp-core-v3-plan, mkp-diverse-v2-plan, mkp-kyberslash-plan, mkp-paper-v4]
  - finding_id: mkp-006
    severity: critical
    title: Official-dudect controls and power fields could be self-attested
    description: >-
      A structurally plausible backend JSON could claim passing A/A, placebo,
      positive controls, and protocol rows without independently recomputing
      every pinned statistic from the three raw CSV artifacts.
    evidence_ids: [mkp-dudect-producer, mkp-dudect-verifier, mkp-producer-control-tests, mkp-control-tests]
  - finding_id: mkp-007
    severity: critical
    title: ASM evidence did not close dependency and rebuild provenance
    description: >-
      Object hashes alone could omit untracked include dependencies, compiler
      transcripts, schema drift, or an independent rebuild of the complete
      660-cell matrix.
    evidence_ids: [mkp-asm-builder, mkp-asm-schema, mkp-asm-checker]
  - finding_id: mkp-008
    severity: critical
    title: TIMECOP final logs could be replaced by self-consistent synthetic evidence
    description: >-
      A fake ELF and matching hand-written logs could satisfy hash and classifier
      fields unless the final validator rebuilt the frozen source and reran the
      exact patched backend.
    evidence_ids: [mkp-baseline-runner, mkp-baseline-schema, mkp-baseline-tests]
  - finding_id: mkp-009
    severity: high
    title: Ciphertext mutation was mislabeled as a proved rejection path
    description: >-
      A nonzero bit mutation plus disagreement with the original encapsulated
      secret does not prove ML-KEM implicit rejection because a different valid
      ciphertext would also disagree.
    evidence_ids: [mkp-timing-template, mkp-kyberslash-config, mkp-kyberslash-doc]
  - finding_id: mkp-010
    severity: critical
    title: Legacy sk-labelled mixed-tuple engineering signals could be over-attributed or reused
    description: >-
      Both committed-corpus v2 and diverse v1 varied a secret key together with
      its matching public ciphertext and embedded public-key material. In
      particular, the disclosed portable engineering observation around
      t=-383 is a mixed-input calibration, not a secret-key claim and not final
      paper evidence.
    evidence_ids: [mkp-core-v3-plan, mkp-core-v3-config, mkp-diverse-v2-plan, mkp-diverse-portable-config, mkp-diverse-x86-config, mkp-preregistration, mkp-paper-v4]
  - finding_id: mkp-011
    severity: critical
    title: A producer-owned valid_tuple passed flag could omit traces or forge attribution
    description: >-
      Without independent reconstruction, a report could set passed=true while
      omitting calibration/control metadata, reusing domain seeds, changing the
      process/effect matrix, permitting secret attribution, or selecting
      metadata from a different target repeat.
    evidence_ids: [mkp-input-validator, mkp-dudect-verifier, mkp-campaign-runner, mkp-analysis, mkp-input-contract-tests]
  - finding_id: mkp-012
    severity: high
    title: The corrected mixed-input boundary still lacks independent human approval
    description: >-
      Automated checks can enforce labels and bytes but cannot supply the two
      independent human judgments required to approve the cryptographic
      attribution boundary before final measurement.
    evidence_ids: [mkp-valid-tuple-review, mkp-review-manifest, mkp-campaign-runner]
  - finding_id: mkp-013
    severity: low
    title: The shared valid_tuple amendment could have drifted KyberSlash v2
    description: >-
      Adding a branch to the shared KEM timing template risked changing the
      frozen chosen-ciphertext or operand-bin classes, their rejection witness,
      compiler contract, or paper routing.
    evidence_ids: [mkp-timing-template, mkp-timing-common, mkp-kyberslash-plan, mkp-kyberslash-config, mkp-kyberslash1-config, mkp-kyberslash2-config, mkp-kyberslash12-config, mkp-binary-contract, mkp-binary-validator, mkp-kyberslash-tests, mkp-paper-v4]
dispositions:
  - finding_id: mkp-001
    status: addressed
    rationale: >-
      The toy source aligns its class-controlled operand with the declared axis
      and uses defined-width arithmetic; the same-corpus manifest binds the
      corrected case.
    blocker: ""
    evidence_ids: [mkp-toy-source, mkp-baseline-manifest]
  - finding_id: mkp-002
    status: accepted-with-blocker
    rationale: >-
      A fail-closed exact-binary evidence builder/checker and frozen compiler
      matrix exist, but the required native raw artifact remains absent before
      execution.
    blocker: >-
      Run the exact-clean-head ML-KEM assembly evidence campaign on native Linux
      x86_64, preserve its content-addressed raw disassembly, and have humans
      review the public attribution packet.
    evidence_ids: [mkp-asm-checker, mkp-asm-builder, mkp-asm-schema]
  - finding_id: mkp-003
    status: addressed
    rationale: >-
      KyberSlash v2 holds the secret key fixed, freezes paired public
      chosen-ciphertext pools, emits input digests, and limits the full-KEM
      result to a public chosen-input contrast.
    blocker: ""
    evidence_ids: [mkp-kyberslash-plan, mkp-kyberslash-config, mkp-kyberslash-doc]
  - finding_id: mkp-004
    status: addressed
    rationale: >-
      KyberSlash v2 freezes GCC Os and rejects a timing binary unless exact
      target symbols contain the preregistered div/idiv count, with matched
      zero-division patched controls.
    blocker: ""
    evidence_ids: [mkp-kyberslash-plan, mkp-binary-contract, mkp-kyberslash-doc]
  - finding_id: mkp-005
    status: accepted-with-blocker
    rationale: >-
      The executable protocols are frozen and fail closed, while every result
      claim remains blocked until fresh final artifacts exist from both
      required physical hosts.
    blocker: >-
      Execute core v3, diverse v2, and KyberSlash v2 at one reviewed commit on
      two non-virtualized native Linux x86_64 hosts with distinct CPU models;
      retain all controls and do not claim a full attack or key recovery.
    evidence_ids: [mkp-core-v3-plan, mkp-diverse-v2-plan, mkp-kyberslash-plan, mkp-paper-v4]
  - finding_id: mkp-006
    status: addressed
    rationale: >-
      The independent verifier reparses calibration, target, and complete
      protocol CSVs, reconstructs frozen seeds and all 102 dudect tests, and
      recomputes controls, directional detection fractions, sensitivity
      diagnostics, and timing validity. The campaign invokes that verifier
      before promotion.
    blocker: ""
    evidence_ids: [mkp-dudect-producer, mkp-dudect-verifier, mkp-campaign-runner, mkp-producer-control-tests, mkp-control-tests]
  - finding_id: mkp-007
    status: addressed
    rationale: >-
      ASM bundles pin the JSON Schema hash, compiler identity and argv,
      transcripts, tracked dependency closure, exact objdump/nm bytes, and an
      isolated source rebuild for every required cell.
    blocker: ""
    evidence_ids: [mkp-asm-builder, mkp-asm-schema, mkp-asm-checker]
  - finding_id: mkp-008
    status: addressed
    rationale: >-
      Final TIMECOP validation checks tracked source and compiler bytes,
      rebuilds the canary and both harnesses in isolation, reruns the exact
      pinned Valgrind, and compares normalized findings and process outcomes
      with preserved raw logs.
    blocker: ""
    evidence_ids: [mkp-baseline-runner, mkp-baseline-schema, mkp-baseline-tests]
  - finding_id: mkp-009
    status: addressed
    rationale: >-
      Every FO and fixed-key chosen-ciphertext pool has an untimed
      scheme-specific rkprf(z, ct) witness; measurement aborts unless
      decapsulation returns the exact independently computed rejection key.
    blocker: ""
    evidence_ids: [mkp-timing-template, mkp-kyberslash-config, mkp-kyberslash-doc]
  - finding_id: mkp-010
    status: addressed
    rationale: >-
      Core v3 declares the committed sk-to-valid_tuple replacement and diverse
      v2 names the same fixed-versus-fresh mixed axis. Paper v4 and the
      preregistration forbid reuse, resume, relabeling, or promotion of core v2
      and diverse v1 engineering traces. The runner rejects final resume and a
      nonempty output root; campaign identity, manifest hash, exact commit, and
      the analyzer's v3/v2 component routing prevent an old report from
      satisfying the new final boundary. The portable t=-383 observation is
      retained only as disclosed mixed-contrast calibration context.
    blocker: ""
    evidence_ids: [mkp-core-v3-plan, mkp-core-v3-doc, mkp-diverse-v2-plan, mkp-diverse-v2-doc, mkp-paper-v4, mkp-preregistration, mkp-campaign-runner, mkp-analysis]
  - finding_id: mkp-011
    status: addressed
    rationale: >-
      For each frozen three-repeat axis, the shared validator authenticates
      three target traces, their three calibrations, three A/A traces, three
      setup-placebo traces, and nine positive-control traces: 21 unique domain
      seeds with the exact 0/1/2 process and three-by-three effect matrix. It
      checks exact runtime attribution metadata, each corpus seed, the
      reconstructed aggregate contract, and selected-analysis metadata.
      Official verification, campaign validation, and final analysis all call
      the same validator, and regression tests reject self-consistent
      passed=true forgeries and incomplete reports.
    blocker: ""
    evidence_ids: [mkp-input-validator, mkp-dudect-verifier, mkp-campaign-runner, mkp-analysis, mkp-input-contract-tests, mkp-producer-control-tests, mkp-control-tests, mkp-analysis-tests]
  - finding_id: mkp-012
    status: accepted-with-blocker
    rationale: >-
      The new premeasurement packet states the mixed public-and-secret threat
      model, no-declassification boundary, expected 21-trace evidence, and
      expiry conditions. It is required by the review manifest and is still
      pending with no reviewers; the final runner therefore cannot construct a
      ready human gate.
    blocker: >-
      Obtain two independent human approvals bound to the exact reviewed source
      commit and evidence-manifest hash for mlkem-valid-tuple-v1 before any
      final run; this automated audit supplies no human-review credit.
    evidence_ids: [mkp-valid-tuple-review, mkp-review-manifest, mkp-campaign-runner, mkp-paper-v4]
  - finding_id: mkp-013
    status: addressed
    rationale: >-
      Direct comparison from 48791fc170e65bf117d029eae80bb3397e2198e5 to
      55f1bf0f0eda949edd52cf36e04ca3a81de780ba found identical KyberSlash v2
      plan, documentation, stock and three variant configs, direct-canary tree,
      ML-KEM source trees, binary contract, timing binary validator, and shared
      timing_v2_common blobs. The timing_kem template changed only through
      valid_tuple-guarded declarations, setup/witness code, and metadata; the
      chosen_ct and operand_bin branches remain unchanged. Paper v4 still
      routes kyberslash-contrast to kyberslash_native_v2.yaml.
    blocker: ""
    evidence_ids: [mkp-kyberslash-plan, mkp-kyberslash-doc, mkp-kyberslash-config, mkp-kyberslash1-config, mkp-kyberslash2-config, mkp-kyberslash12-config, mkp-binary-contract, mkp-binary-validator, mkp-timing-template, mkp-timing-common, mkp-kyberslash-tests, mkp-paper-v4]

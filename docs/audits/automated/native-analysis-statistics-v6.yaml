scope:
  - control-only use of the completed V1 engineering rehearsal
  - separation of V2 operational headroom from unchanged final decision thresholds
  - two-clean-run qualification, artifact preservation, multiplicity, and single-host claims
findings:
  - finding_id: nsv9-001
    severity: critical
    title: Reduced target statistics must not select the V9 method
    description: One-thousand-sample rehearsal target traces are deliberately underpowered and cannot choose effects, thresholds, counts, exclusions, axes, or paper conclusions without post-selection bias.
    evidence_ids: [nsv9-calibration, nsv9-profile, nsv9-prereg]
  - finding_id: nsv9-002
    severity: high
    title: Operational safety margins could be mistaken for amended final thresholds
    description: The V2 limits of absolute t below 3.5 and largest positive t at most -15 are launch headroom checks and must not replace the final 4.5 and -10 decision rules.
    evidence_ids: [nsv9-profile, nsv9-contract, nsv9-prereg]
  - finding_id: nsv9-003
    severity: high
    title: Two claimed clean rehearsals could be stale, duplicated, or from another commit
    description: Counting two PASS labels is insufficient unless run IDs, exact commit, current profile and calibration hashes, full blocker-free summaries, and immutable source-report hashes are independently verified.
    evidence_ids: [nsv9-rehearsal, nsv9-native-runner, nsv9-native-tests]
  - finding_id: nsv9-004
    severity: high
    title: A single A/A tail observation does not justify adaptive null-control changes
    description: The V1 ML-DSA-44 absolute t of 3.7793 exceeded rehearsal headroom but remained inside the final threshold; changing counts, seeds, or thresholds from one null tail would be outcome-driven.
    evidence_ids: [nsv9-calibration, nsv9-prereg]
  - finding_id: nsv9-005
    severity: high
    title: V9 inferential results and multiplicity outputs remain unavailable
    description: Two rehearsals validate launch controls only; they cannot supply final target findings, Holm-adjusted contrasts, output-length diagnostics, or cross-host evidence.
    evidence_ids: [nsv9-plan, nsv9-analysis, nsv9-claims]
dispositions:
  - finding_id: nsv9-001
    status: addressed
    rationale: The calibration source-of-truth sets target_statistics_used_for_calibration=false, enumerates every forbidden target input, records one uniform rule based only on largest-effect positive controls, and the static checker binds its exact source run and effect matrix.
    blocker: ""
    evidence_ids: [nsv9-calibration, nsv9-prereg, nsv9-checker, nsv9-config-tests]
  - finding_id: nsv9-002
    status: addressed
    rationale: The V2 profile and operator contract label 3.5 and -15 as rehearsal safety margins, while predecessor comparison proves final counts, repeats, A/A limit, positive threshold, alpha, and target power are unchanged.
    blocker: ""
    evidence_ids: [nsv9-profile, nsv9-contract, nsv9-checker, nsv9-config-tests]
  - finding_id: nsv9-003
    status: addressed
    rationale: Qualification requires exactly two distinct run IDs at one commit; final launch reopens both source reports and rejects any identity, hash, summary, phase, profile, calibration, or commit drift before sampling.
    blocker: ""
    evidence_ids: [nsv9-rehearsal, nsv9-native-runner, nsv9-native-tests, nsv9-rehearsal-tests]
  - finding_id: nsv9-004
    status: addressed
    rationale: The calibration records no parameter change for the A/A observation and requires it to resolve naturally in two fresh independent V2 runs under the unchanged final protocol.
    blocker: ""
    evidence_ids: [nsv9-calibration, nsv9-prereg, nsv9-profile]
  - finding_id: nsv9-005
    status: accepted-with-blocker
    rationale: The campaign and claim matrix remain pending-physical-measurement and prohibit cross-host or constant-time claims.
    blocker: After two clean V2 rehearsals, collect all fresh V9 final axes and baselines, build the preserved single-host bundle, and run the deterministic named analysis before populating any result table.
    evidence_ids: [nsv9-plan, nsv9-analysis, nsv9-claims]

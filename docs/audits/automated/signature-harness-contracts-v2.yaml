findings:
  - finding_id: shc-001
    severity: critical
    title: Signature rows could survive a failed call or swapped measured binary
    description: Timing values are inadmissible without successful measured calls, an untimed sign-to-verify gate, output-length bounds, and premeasurement source/binary/compiler seals.
    evidence_ids: [shc-build-provenance, shc-mldsa-adapter, shc-premeasurement-tests]
  - finding_id: shc-002
    severity: high
    title: Fresh Falcon v2 host-scoped comparator results do not yet exist
    description: Static instruction contracts and calibration tests do not supply the six final physical timing axes or length association.
    evidence_ids: [shc-falcon-v2, shc-falcon-contracts, shc-analysis]
  - finding_id: shc-003
    severity: medium
    title: No independent reviewer is available for signature declassification
    description: V6 may report measured host-scoped findings but cannot claim independent human declassification or agreement.
    evidence_ids: [shc-v6-plan, shc-analysis-contract]
dispositions:
  - finding_id: shc-001
    status: addressed
    rationale: The harness and validator bind return codes, correctness round trips, fixed/bounded lengths, exact linked binaries, and universal build seals before accepting timing rows.
    blocker: ""
    evidence_ids: [shc-build-provenance, shc-mldsa-adapter, shc-premeasurement-tests]
  - finding_id: shc-002
    status: accepted-with-blocker
    rationale: Falcon v2 is frozen but remains pending physical measurement.
    blocker: Execute all six Falcon final axes and emit the predeclared full-API and output-length secondary results from the schema-v5 bundle.
    evidence_ids: [shc-falcon-v2, shc-falcon-contracts, shc-analysis]
  - finding_id: shc-003
    status: accepted-with-blocker
    rationale: The unavailable review is removed as a v6 execution gate and retained as an explicit claim limitation.
    blocker: Do not use independent-review, declassified-by-review, or inter-rater-agreement wording for v6 results.
    evidence_ids: [shc-v6-plan, shc-analysis-contract]

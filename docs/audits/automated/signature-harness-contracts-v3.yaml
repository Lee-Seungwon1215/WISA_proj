scope:
  - signature dual-read masked key/message materialization before t0
  - randomness-policy contract and signature correctness/output-length evidence
  - Falcon reference, native-FP, and integer-FPR comparison boundaries
findings:
  - finding_id: shc7-001
    severity: critical
    title: Signature pool selection shared the v6 pre-t0 class pointer confound
    description: Key or message class selection used a conditional source address immediately before the signer timing boundary.
    evidence_ids: [shc7-preregistration, shc7-sign-template]
  - finding_id: shc7-002
    severity: high
    title: Randomness validity must distinguish an explicit deterministic API from a hidden failed interpose
    description: Unconditionally requiring seeded-interpose rejects a declared deterministic no-randombytes API, while accepting external-or-none for ordinary PQC signers would hide unreproducible randomness.
    evidence_ids: [shc7-cli, shc7-preregistration]
  - finding_id: shc7-003
    severity: high
    title: Full-signature Falcon timing cannot be relabeled as sampler-only or FIPS conformance
    description: The measured API includes signing randomness, acceptance behavior, variable-length encoding where configured, and implementation-specific prospective comparators.
    evidence_ids: [shc7-falcon, shc7-plan]
  - finding_id: shc7-004
    severity: high
    title: Fresh v7 signature results are pending
    description: The v6 signature traces used the superseded setup and cannot be reused.
    evidence_ids: [shc7-plan, shc7-preregistration]
dispositions:
  - finding_id: shc7-001
    status: addressed
    rationale: Signature key and message setup now reads both slots, selects with the common no-inline mask, records dual-read-masked-select-v4 on every trace, and validity requires that exact contract.
    blocker: ""
    evidence_ids: [shc7-sign-template, shc7-common-template, shc7-cli, shc7-template-tests]
  - finding_id: shc7-002
    status: addressed
    rationale: external-or-none is accepted only when randombytes_header is explicitly null; all other KEM/sign harnesses still require seeded-interpose, with regression tests for both directions.
    blocker: ""
    evidence_ids: [shc7-cli, shc7-cli-tests]
  - finding_id: shc7-003
    status: addressed
    rationale: The frozen Falcon manifest and V7 claim limits retain full-API, variable-length, prospective-comparator, and non-conformance wording.
    blocker: ""
    evidence_ids: [shc7-falcon, shc7-plan]
  - finding_id: shc7-004
    status: accepted-with-blocker
    rationale: Calibration established harness readiness only.
    blocker: Run all fresh v7 signature axes and require correctness, return-code, output-length, setup, physical-control, binary-contract, and artifact-hash gates.
    evidence_ids: [shc7-plan, shc7-falcon]

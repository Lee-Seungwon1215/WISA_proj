scope:
  - v6 and v7 invalid-attempt disclosure and prohibition on result selection
  - official-dudect repeat, control, and explicit randomness-policy validity
  - named single-host analysis, multiplicity, and non-replication wording
findings:
  - finding_id: nas8-001
    severity: critical
    title: Retaining completed v7 rows after a post-observation validator amendment would be selective reuse
    description: Even target rows with passing controls were generated under a method whose semantic RNG contract was wrong, so all components must restart rather than keeping favorable partial results.
    evidence_ids: [nas8-preregistration, nas8-plan]
  - finding_id: nas8-002
    severity: high
    title: Randomness policy must be independently bound to raw-protocol interpretation
    description: Expected and observed runtime values must be checked against the frozen config before any target statistic is interpreted.
    evidence_ids: [nas8-cli, nas8-independent-verifier, nas8-runner]
  - finding_id: nas8-003
    severity: high
    title: Three process repeats cannot estimate cross-host heterogeneity
    description: Within-host repeats support consistency and secondary effects but are not independent physical hosts.
    evidence_ids: [nas8-analysis-contract, nas8-claim-matrix]
  - finding_id: nas8-004
    severity: high
    title: No v8 final dataset exists at the audited commit
    description: Named analysis outputs cannot be generated or interpreted before every frozen input and baseline passes final validation.
    evidence_ids: [nas8-plan, nas8-analysis-contract]
dispositions:
  - finding_id: nas8-001
    status: addressed
    rationale: The preregistration identifies the v7 commit and component run IDs, records the precise failure, forbids reuse of every raw and derived artifact, and requires fresh v8 roots at one later commit.
    blocker: ""
    evidence_ids: [nas8-preregistration, nas8-plan]
  - finding_id: nas8-002
    status: addressed
    rationale: The CLI emits both fields, and the native plus same-corpus paths pass config-derived expectations into the independent official-dudect verifier before promotion.
    blocker: ""
    evidence_ids: [nas8-cli, nas8-independent-verifier, nas8-runner, nas8-baseline-runner]
  - finding_id: nas8-003
    status: addressed
    rationale: Named analysis reports host heterogeneity as unavailable, applies within-family Holm correction, and limits conclusions to the measured host.
    blocker: ""
    evidence_ids: [nas8-analysis-contract, nas8-claim-matrix]
  - finding_id: nas8-004
    status: accepted-with-blocker
    rationale: The audited commit freezes methods and explicitly makes no final timing claim.
    blocker: Collect the complete fresh v8 host tree, validate every upstream artifact, then generate and byte-check named JSON, CSV, and Markdown outputs.
    evidence_ids: [nas8-plan, nas8-analysis-contract]

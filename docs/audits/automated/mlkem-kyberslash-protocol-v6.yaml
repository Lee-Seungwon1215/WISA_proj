findings:
  - finding_id: mkv9-001
    severity: critical
    title: Post-observation target tuning would invalidate the V9 campaign
    description: The completed V1 rehearsal contains reduced target traces, so any target t-score, status, direction, consistency, or baseline finding used to choose V9 parameters would create selective analysis.
    evidence_ids: [mkv9-calibration, mkv9-prereg, mkv9-profile]
  - finding_id: mkv9-002
    severity: high
    title: Shared manifest-target effects can change more than the triggering ML-KEM axis
    description: The committed-corpus ML-KEM target has three harnesses under one effect ladder, so selection by its valid-tuple axis necessarily updates the largest injected delay for all three harnesses and must be explicit.
    evidence_ids: [mkv9-calibration, mkv9-core, mkv9-checker, mkv9-tests]
  - finding_id: mkv9-003
    severity: high
    title: Stronger controls do not strengthen leakage attribution
    description: Valid-tuple remains mixed public-and-secret input, chosen ciphertext remains public input, and operand-bin timing remains a site-specific hardware-latency canary rather than a key-recovery result.
    evidence_ids: [mkv9-kyberslash, mkv9-plan, mkv9-claims]
  - finding_id: mkv9-004
    severity: high
    title: Fresh V9 ML-KEM and KyberSlash runtime evidence is pending
    description: Manifest equality and calibration provenance cannot establish physical-host A/A, placebo, power, or target outcomes.
    evidence_ids: [mkv9-profile, mkv9-core, mkv9-kyberslash]
dispositions:
  - finding_id: mkv9-001
    status: addressed
    rationale: The calibration record enumerates allowed control inputs and forbids every reduced-target statistic; one uniform manifest-target rule selects nine targets, and the checker binds the source run hashes and exact allowed V8-to-V9 deltas.
    blocker: ""
    evidence_ids: [mkv9-calibration, mkv9-prereg, mkv9-checker, mkv9-tests]
  - finding_id: mkv9-002
    status: addressed
    rationale: The calibration explicitly declares manifest-target as the selection unit and documents the shared-harness effect policy; static validation compares every V9 target against its predecessor and rejects any non-effect protocol change.
    blocker: ""
    evidence_ids: [mkv9-calibration, mkv9-core, mkv9-checker, mkv9-tests]
  - finding_id: mkv9-003
    status: addressed
    rationale: V9 changes only selected largest positive-control effects while preserving axes, setup, source, compiler, RNG, and binary contracts; the campaign and claim matrix retain all three attribution prohibitions.
    blocker: ""
    evidence_ids: [mkv9-kyberslash, mkv9-plan, mkv9-claims, mkv9-checker]
  - finding_id: mkv9-004
    status: accepted-with-blocker
    rationale: The audited commit freezes methods and makes no final ML-KEM or KyberSlash timing claim.
    blocker: Obtain two blocker-free V2 rehearsals at this exact commit, then execute the core V4 and KyberSlash V4 final roots fresh with the resulting qualification.
    evidence_ids: [mkv9-profile, mkv9-core, mkv9-kyberslash]

scope:
  - c-fn-dsa seeded-interpose behavior despite null declaration headers
  - signature correctness, output-length, and dual-read masked setup contracts
  - Falcon reference, native-FP, and integer-FPR comparison boundaries
findings:
  - finding_id: shc8-001
    severity: critical
    title: Header-based RNG inference would misclassify all four c-fn-dsa profiles
    description: The c-fn-dsa adapter explicitly calls randombytes for deterministic key-generation and signing seeds even though its configs require no randombytes declaration header.
    evidence_ids: [shc8-adapter, shc8-config, shc8-cli, shc8-preregistration]
  - finding_id: shc8-002
    severity: high
    title: Expected and observed signature RNG policy need independent validation
    description: A report-local expectation alone cannot distinguish a seeded interpose from a strong target symbol or a missing call.
    evidence_ids: [shc8-cli, shc8-independent-verifier, shc8-runner]
  - finding_id: shc8-003
    severity: high
    title: Full-signature Falcon timing cannot be relabeled as sampler-only or FIPS conformance
    description: The measured APIs include signing randomness and encoding behavior, while c-fn-dsa remains a prospective comparator.
    evidence_ids: [shc8-falcon, shc8-plan]
  - finding_id: shc8-004
    severity: high
    title: Fresh v8 signature results are pending
    description: Prior signature traces use superseded setup or validation semantics and cannot be promoted.
    evidence_ids: [shc8-plan, shc8-preregistration]
dispositions:
  - finding_id: shc8-001
    status: addressed
    rationale: All four c-fn-dsa configs explicitly require seeded-interpose independently of their null headers, and regression tests pin the distinction together with the adapter calls.
    blocker: ""
    evidence_ids: [shc8-adapter, shc8-config, shc8-config-tests]
  - finding_id: shc8-002
    status: addressed
    rationale: The CLI records the frozen expectation and runtime observation; the native runner and independent official-dudect verifier reconstruct the expected policy from the config and reject either mismatch.
    blocker: ""
    evidence_ids: [shc8-cli, shc8-independent-verifier, shc8-runner]
  - finding_id: shc8-003
    status: addressed
    rationale: The frozen Falcon manifest and v8 claim limits retain full-API, variable-length, prospective-comparator, and non-conformance wording.
    blocker: ""
    evidence_ids: [shc8-falcon, shc8-plan]
  - finding_id: shc8-004
    status: accepted-with-blocker
    rationale: Corrected contracts establish premeasurement readiness only.
    blocker: Run every fresh v8 signature axis and require correctness, return-code, output-length, setup, RNG, physical-control, binary-contract, and artifact-hash gates.
    evidence_ids: [shc8-plan, shc8-falcon]

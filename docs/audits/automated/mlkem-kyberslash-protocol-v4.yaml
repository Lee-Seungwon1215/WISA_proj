audited_commit: 625b86f69b339c5137e479dbca7266c569e4f39b
scope:
  - KyberSlash operand-v3 setup randomness versus measured-interval randomness
  - general KEM dual-read masked class materialization before t0
  - ML-KEM valid-tuple and public chosen-ciphertext attribution limits
findings:
  - finding_id: mkp8-001
    severity: critical
    title: Null randombytes_header was incorrectly treated as a no-RNG contract
    description: The operand adapters omit a declaration header but call the weak seeded interpose during setup, so header-based inference invalidated six otherwise complete v7 target artifacts.
    evidence_ids: [mkp8-preregistration, mkp8-config, mkp8-operand-config, mkp8-cli]
  - finding_id: mkp8-002
    severity: high
    title: Setup RNG must not conceal RNG calls inside measured decapsulation
    description: Seeded setup is reproducible, but an operand canary must independently prove that the timed arithmetic-site call performs zero randombytes calls.
    evidence_ids: [mkp8-input-contract, mkp8-operand-tests]
  - finding_id: mkp8-003
    severity: high
    title: Mixed valid-tuple signals cannot be called secret-key leakage
    description: Both secret and matching public material vary on the valid-tuple axis regardless of setup or RNG contract correctness.
    evidence_ids: [mkp8-plan, mkp8-preregistration]
  - finding_id: mkp8-004
    severity: high
    title: Fresh v8 ML-KEM and KyberSlash timing evidence is pending
    description: V7 traces are diagnostic only, and corrected contracts do not substitute for fresh physical traces and controls.
    evidence_ids: [mkp8-plan, mkp8-preregistration]
dispositions:
  - finding_id: mkp8-001
    status: addressed
    rationale: Randomness policy is now a semantic config field independent of header inclusion; every operand config explicitly requires seeded-interpose and all validation layers compare the runtime observation with that policy.
    blocker: ""
    evidence_ids: [mkp8-config, mkp8-operand-config, mkp8-cli, mkp8-runner]
  - finding_id: mkp8-002
    status: addressed
    rationale: Operand-v3 runtime and independently reconstructed input contracts now require measured_rng_calls=0 in addition to seeded-interpose setup metadata and decapsulation return-code witnesses.
    blocker: ""
    evidence_ids: [mkp8-input-contract, mkp8-operand-tests, mkp8-runner]
  - finding_id: mkp8-003
    status: addressed
    rationale: V8 retains explicit mixed-input attribution limits in both the frozen plan and preregistration.
    blocker: ""
    evidence_ids: [mkp8-plan, mkp8-preregistration]
  - finding_id: mkp8-004
    status: accepted-with-blocker
    rationale: The audited commit freezes corrected methods but makes no physical timing claim.
    blocker: Execute every v8 ML-KEM and KyberSlash axis in fresh final roots and pass correctness, setup, RNG, controls, binary contracts, hashes, and named analysis.
    evidence_ids: [mkp8-plan, mkp8-kyberslash]

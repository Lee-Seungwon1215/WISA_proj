    evidence_ids: [shv10-profile, shv10-native-runner, shv10-native-tests]
  - finding_id: shv10-003
    severity: high
    title: Host and control changes must not weaken full-signature semantics
    description: Verification, return-code, output-length, randomness, build seals, linked binaries, and the FIPS 206 claim limit must remain intact.
    evidence_ids: [shv10-falcon, shv10-diverse, shv10-falcon-checker, shv10-analysis, shv10-claims]
  - finding_id: shv10-004
    severity: high

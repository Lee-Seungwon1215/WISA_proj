  - exact-commit two-rehearsal qualification before every V10 final component or baseline
  - same-host and frozen-SMT/turbo lineage across rehearsal steps and operational repeats
  - preservation of qualification and both source reports inside the single-host hash tree
findings:
  - finding_id: aiv10-001
    severity: critical
    title: A self-declared ready qualification could bypass its source reports
    description: Final launch must reopen both reports and recompute their hashes, identities, commit, profile, calibration, complete summary, and blocker-free state.
    evidence_ids: [aiv10-native-runner, aiv10-rehearsal, aiv10-profile, aiv10-schema]
  - finding_id: aiv10-002
    severity: high
    title: Two clean reports could come from different hosts or unstable host controls
    description: Distinct run IDs alone do not prove one physical host, one CPU model and affinity, or SMT-off and turbo-off state.
    evidence_ids: [aiv10-rehearsal, aiv10-native-runner, aiv10-rehearsal-tests, aiv10-native-tests]
  - finding_id: aiv10-003
    severity: high
    title: V10 qualification and final physical evidence remain pending
    description: Source closure and a failed diagnostic V2-A report do not establish that two V3 rehearsals or any V10 final result pass.
    evidence_ids: [aiv10-plan, aiv10-contract, aiv10-calibration]
dispositions:
  - finding_id: aiv10-001
    status: addressed
    rationale: The final gate independently opens two regular report files under the same host tree, verifies exact hashes and distinct run IDs, and recomputes all frozen identity and readiness fields before sampling.
    blocker: ""
    evidence_ids: [aiv10-native-runner, aiv10-rehearsal, aiv10-profile, aiv10-schema, aiv10-native-tests]
  - finding_id: aiv10-002
    status: addressed
    rationale: Rehearsal closure compares all four components and three baselines; qualification and final launch independently require one machine-id hash, CPU model, architecture, affinity, SMT-off readback, and turbo-off readback across both runs.
    blocker: ""
    evidence_ids: [aiv10-rehearsal, aiv10-native-runner, aiv10-baseline, aiv10-rehearsal-tests, aiv10-native-tests]
  - finding_id: aiv10-003
    status: accepted-with-blocker
    rationale: The audited commit is deliberately premeasurement and labels every rehearsal artifact non-promotable.
    blocker: Execute two blocker-free V3 rehearsals on the same physical host at this exact commit, retain their qualification, then execute all fresh V10 final commands and assembly evidence before building the host bundle.
    evidence_ids: [aiv10-plan, aiv10-contract, aiv10-calibration, aiv10-bundle]

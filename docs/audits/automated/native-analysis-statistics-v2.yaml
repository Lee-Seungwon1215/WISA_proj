scope:
  - single-host primary status folding and within-host process-repeat contrasts
  - explicit non-applicability of cross-host heterogeneity
  - deterministic named output, input ledger, and upstream artifact validation
findings:
  - finding_id: nas-001
    severity: critical
    title: Process repeats could be mislabeled as independent hosts
    description: Computing Cochran Q or I-squared from three repeats on one machine would fabricate hardware replication and overstate generality.
    evidence_ids: [nas-analysis, nas-analysis-contract, nas-tests]
  - finding_id: nas-002
    severity: critical
    title: Named statistics could consume partial or self-attested component reports
    description: Final tables require raw protocol reconstruction, exact host/commit/build hashes, all frozen targets, and passing upstream validators.
    evidence_ids: [nas-analysis, nas-bundle-builder, nas-bundle-tests]
  - finding_id: nas-003
    severity: high
    title: No final v6 dataset exists at the audited commit
    description: Synthetic regression values are not paper timing results.
    evidence_ids: [nas-v6-plan, nas-preregistration]
  - finding_id: nas-004
    severity: medium
    title: V6 named analysis is not independently blinded
    description: With no independent analyst available, retrospective label hiding would not justify a blinding claim.
    evidence_ids: [nas-analysis-contract, nas-v6-plan]
dispositions:
  - finding_id: nas-001
    status: addressed
    rationale: Single-host analysis emits heterogeneity as not-applicable with zero degrees of freedom; repeats remain within-host effects and the paper wording forbids cross-host generalization.
    blocker: ""
    evidence_ids: [nas-analysis, nas-analysis-contract, nas-tests]
  - finding_id: nas-002
    status: addressed
    rationale: Schema-v5 preparation and analysis require one complete host tree, unique final run IDs, consistent machine/compiler identity, SHA256SUMS, assembly evidence, complete baselines, and independent reruns of every artifact validator.
    blocker: ""
    evidence_ids: [nas-analysis, nas-bundle-builder, nas-bundle-tests]
  - finding_id: nas-003
    status: accepted-with-blocker
    rationale: The code commit is a premeasurement freeze and makes no empirical claim.
    blocker: Execute and validate the 28-axis campaign before populating Section 5 timing tables.
    evidence_ids: [nas-v6-plan, nas-preregistration]
  - finding_id: nas-004
    status: accepted-with-blocker
    rationale: Named deterministic analysis is disclosed as the available profile rather than mislabeled blind review.
    blocker: Do not claim analyst blinding; retain exact input/output hashes and byte-reproduction checks.
    evidence_ids: [nas-analysis-contract, nas-v6-plan]

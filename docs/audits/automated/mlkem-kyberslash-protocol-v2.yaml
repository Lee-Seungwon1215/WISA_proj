findings:
  - finding_id: mkp-001
    severity: critical
    title: ML-KEM valid-tuple timing can be over-attributed to secret material
    description: The fixed-versus-fresh class changes matching public and secret material together and cannot identify a secret-only cause.
    evidence_ids: [mkp-core-v3, mkp-input-contract, mkp-preregistration]
  - finding_id: mkp-002
    severity: critical
    title: KyberSlash v2 operand traces contain setup and placebo confounds
    description: Different source addresses and an invalid frozen placebo can create or hide class effects outside the intended arithmetic site.
    evidence_ids: [mkp-kyberslash-v3, mkp-operand-tests, mkp-preregistration]
  - finding_id: mkp-003
    severity: high
    title: Fresh v6 ML-KEM and KyberSlash measurements do not yet exist
    description: Frozen contracts and tests are preparation rather than empirical host-scoped findings.
    evidence_ids: [mkp-v6-plan, mkp-kyberslash-v3]
dispositions:
  - finding_id: mkp-001
    status: addressed
    rationale: The v3 campaign, trace validator, preregistration, and analyzer require the valid_tuple label and explicitly prohibit secret attribution.
    blocker: ""
    evidence_ids: [mkp-core-v3, mkp-input-contract, mkp-preregistration, mkp-analysis]
  - finding_id: mkp-002
    status: addressed
    rationale: V3 selects both bins branchlessly from one pool index into one shared work address, uses a valid coefficient-1664 placebo, validates return-code witnesses, and rejects reuse of v2 traces.
    blocker: ""
    evidence_ids: [mkp-kyberslash-v3, mkp-operand-tests, mkp-preregistration]
  - finding_id: mkp-003
    status: accepted-with-blocker
    rationale: The campaign remains honestly pending physical measurement.
    blocker: Execute every v6 ML-KEM and KyberSlash axis in fresh final roots and pass all controls, input contracts, build seals, hashes, and named analysis.
    evidence_ids: [mkp-v6-plan, mkp-kyberslash-v3]

scope:
  - schema-v5 single-physical-host identity, component, baseline, assembly, and hash-manifest binding
  - automated frozen-input gate and explicit absence of human-review or cross-host claims
  - fresh final roots, unique run identities, clean commit, and deterministic named output
findings:
  - finding_id: abi-001
    severity: critical
    title: A hand-written single-host bundle could substitute stale or unrelated artifacts
    description: Host labels and relative paths alone cannot prove that all components, baselines, assembly evidence, commit, CPU identity, and run IDs belong to one complete final execution.
    evidence_ids: [abi-bundle-template, abi-bundle-builder, abi-analysis]
  - finding_id: abi-002
    severity: high
    title: One host or an automated check could be mislabeled as replication or independent review
    description: Removing unavailable gates is acceptable only if every machine-readable policy and paper-facing description preserves the narrower scope.
    evidence_ids: [abi-v6-plan, abi-preregistration, abi-analysis-contract]
  - finding_id: abi-003
    severity: high
    title: No v6 final physical-host artifact exists at the audited commit
    description: Static validators and synthetic tests establish readiness, not an empirical timing result.
    evidence_ids: [abi-v6-plan, abi-claim-matrix]
  - finding_id: abi-004
    severity: critical
    title: Final execution could drift from the frozen inputs after the gate was checked
    description: A gate that records only a boolean could allow runner, analyzer, manifest, dependency-lock, or bundle-contract mutation.
    evidence_ids: [abi-native-runner, abi-v6-plan]
dispositions:
  - finding_id: abi-001
    status: addressed
    rationale: The bundle builder fail-closes on one fresh report per component/tool, exact commit/CPU/machine identity, unique run IDs, eligible assembly evidence, and a complete host SHA256SUMS; the analyzer independently revalidates all upstream artifacts.
    blocker: ""
    evidence_ids: [abi-bundle-builder, abi-analysis, abi-bundle-tests]
  - finding_id: abi-002
    status: addressed
    rationale: The v6 plan, preregistration, analysis contract, gate payload, and generated claim tables explicitly record one host, no cross-host reproducibility, and no independent human review.
    blocker: ""
    evidence_ids: [abi-v6-plan, abi-preregistration, abi-analysis-contract, abi-claim-matrix]
  - finding_id: abi-003
    status: accepted-with-blocker
    rationale: Measurement is the next authorized phase; the audited commit remains premeasurement and makes no empirical timing claim.
    blocker: Complete all 28 final axes, three baseline tools, assembly evidence, schema-v5 bundle, and named deterministic analysis on the recorded physical host.
    evidence_ids: [abi-v6-plan, abi-claim-matrix]
  - finding_id: abi-004
    status: addressed
    rationale: Every final report embeds the exact clean commit and SHA-256 map over the v6 plan, preregistration, analysis contract, component/baseline/assembly manifests, runner/analyzer/builder code, schemas, and dependency locks.
    blocker: ""
    evidence_ids: [abi-native-runner, abi-v6-plan]

scope:
  - v6 invalid-attempt disclosure and prohibition on best-run selection
  - official-dudect repeat/control validity and corrected same-corpus negative control
  - named single-host analysis, multiplicity, and non-replication wording
findings:
  - finding_id: nas7-001
    severity: critical
    title: Retaining only a favorable v6 dudect retry would be outcome-dependent selection
    description: Both invalid v6 attempts and all calibration iterations must remain disclosed and non-promotable rather than being replaced by the first convenient pass.
    evidence_ids: [nas7-preregistration, nas7-plan]
  - finding_id: nas7-002
    severity: high
    title: Three process repeats cannot estimate cross-host heterogeneity
    description: Within-host repeats support consistency and secondary effects but are not independent physical hosts.
    evidence_ids: [nas7-analysis-contract, nas7-claim-matrix]
  - finding_id: nas7-003
    severity: high
    title: The same-corpus expected negative requires a meaningful workload and valid controls
    description: An ultra-short optimized target and weak positive ceiling can create threshold artifacts or insufficient-power results unrelated to the intended comparison.
    evidence_ids: [nas7-baseline, nas7-toy-config, nas7-toy-source, nas7-baseline-tests]
  - finding_id: nas7-004
    severity: high
    title: No v7 final dataset exists at the audited commit
    description: Named analysis outputs cannot be generated or interpreted before all frozen inputs pass final validation.
    evidence_ids: [nas7-plan, nas7-analysis-contract]
dispositions:
  - finding_id: nas7-001
    status: addressed
    rationale: The preregistration records exact v6 run IDs, failure reasons, calibration commit, and non-reuse rule; V7 requires every component to start fresh at one later commit.
    blocker: ""
    evidence_ids: [nas7-preregistration, nas7-plan]
  - finding_id: nas7-002
    status: addressed
    rationale: Named analysis reports host heterogeneity as unavailable, applies within-family Holm correction, and limits conclusions to the measured host.
    blocker: ""
    evidence_ids: [nas7-analysis-contract, nas7-claim-matrix]
  - finding_id: nas7-003
    status: addressed
    rationale: The toy negative now executes fixed input-independent work, deterministic no-RNG metadata is explicit, the positive ladder is 512/2048/8192 ticks, and raw/control validation remains fail closed.
    blocker: ""
    evidence_ids: [nas7-baseline, nas7-toy-config, nas7-toy-source, nas7-cli, nas7-baseline-tests]
  - finding_id: nas7-004
    status: accepted-with-blocker
    rationale: The audited commit freezes methods and does not claim a result.
    blocker: Collect the complete fresh v7 host tree, validate every upstream artifact, then generate and byte-check named JSON, CSV, and Markdown outputs.
    evidence_ids: [nas7-plan, nas7-analysis-contract]

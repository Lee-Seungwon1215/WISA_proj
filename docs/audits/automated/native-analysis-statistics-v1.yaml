schema_version: "1.0"
audit_id: automated-native-analysis-statistics-v1
status: complete
title: Automated contract audit of two-host native timing analysis and statistics
perspective: native-analysis-statistics
automated_agent: true
human_reviewer: false
automated_agent_id: paper-analysis-automated-self-audit
audited_at: "2026-08-10T11:40:00Z"
audited_commit: 55f1bf0f0eda949edd52cf36e04ca3a81de780ba
scope:
  - exact component, target, host, commit, and input-hash provenance
  - conservative primary two-host risk folding
  - preregistered pairwise Welch contrasts and family-local Holm adjustment
  - Cochran Q and I-squared host heterogeneity
  - signature duration-output-length association and failed-call invalidation
  - deterministic blinded and unblinded JSON, CSV, Markdown, and manifest parity
  - directional seeded positive-control acceptance and independent recomputation
  - threshold-based A/A planning diagnostics and frozen ML-DSA control curves
  - versioned Falcon engineering calibration, amendment boundaries, and final-campaign routing
  - versioned mixed ML-KEM valid-tuple attribution, exact trace-contract reconstruction, and replacement-artifact isolation
findings:
  - finding_id: nas-001
    severity: critical
    title: Analysis could trust user-entered host and target identities
    description: Without cross-layer component, manifest, backend, protocol, machine, and commit checks, a result from another host or campaign could enter the paper tables.
    evidence_ids: [nas-analysis, nas-spec]
  - finding_id: nas-002
    severity: critical
    title: Host disagreement could be averaged into an apparent clean result
    description: A combined statistic without a conservative risk fold could conceal a valid finding observed on one CPU model.
    evidence_ids: [nas-analysis, nas-tests]
  - finding_id: nas-003
    severity: high
    title: Preregistered pairwise multiplicity and host heterogeneity were absent
    description: Family-local contrasts, Holm adjustment, and explicit between-host disagreement metrics needed frozen executable definitions before measurement.
    evidence_ids: [nas-analysis, nas-spec, nas-tests]
  - finding_id: nas-004
    severity: critical
    title: Failed signing and output-length variation could corrupt secondary analysis
    description: Duration-length association is uninterpretable if failed API calls, malformed length contracts, or constant-length rows are silently treated as valid variation.
    evidence_ids: [nas-analysis, nas-tests]
  - finding_id: nas-005
    severity: critical
    title: Named artifacts could be exposed before the analyst completed frozen analysis
    description: Honest analyst-label blinding requires opaque output and a byte-identical post-unblinding reproduction, not a retrospective checkbox.
    evidence_ids: [nas-analysis, nas-spec, nas-bundle]
  - finding_id: nas-006
    severity: high
    title: No final two-host dataset or independent statistical review exists yet
    description: Synthetic tests establish implementation behavior but cannot establish empirical findings or independent methodological approval.
    evidence_ids: [nas-tests]
  - finding_id: nas-007
    severity: critical
    title: Statistical controls could be copied from backend self-attestation
    description: Final analysis could consume reported A/A, placebo, detection, nominal-sensitivity, and validity fields without independently deriving them from complete raw protocol rows.
    evidence_ids: [nas-dudect-verifier, nas-analysis]
  - finding_id: nas-008
    severity: high
    title: Postmeasurement review commit created an impossible promotion gate
    description: Combining premeasurement M and postmeasurement R0 into one reviewed-commit set caused validators requiring exactly one premeasurement commit to reject every correctly completed two-phase review.
    evidence_ids: [nas-review-checker, nas-review-tests]
  - finding_id: nas-009
    severity: high
    title: Power and MDE prose exceeded the implemented estimands
    description: The A/A-derived directional diagnostic estimates an effect for 80% detection probability in one repeat, while the campaign separately requires an observed three detections out of three; conflating either with achieved campaign power or a bound on the unobserved target effect would exceed the implemented estimands.
    evidence_ids: [nas-preregistration, nas-cli]
  - finding_id: nas-010
    severity: high
    title: An absolute-value canary gate could accept a reversed seeded effect
    description: The positive control injects delay only into class 1, so a large class-0-slower result is a contradiction or confound rather than evidence that the intended canary was detected; accepting either t-score direction could incorrectly validate an experiment.
    evidence_ids: [nas-cli, nas-dudect-verifier, nas-control-tests, nas-campaign-tests]
  - finding_id: nas-011
    severity: high
    title: ML-DSA positive-control effects were not scaled to the actual detection rule
    description: Selecting a signature canary curve without relating its largest delay to the frozen t-score threshold and observed A/A standard error can make an otherwise operating harness predictably fail the validity gate.
    evidence_ids: [nas-cli, nas-primary-campaign, nas-diverse-campaign, nas-campaign-tests]
  - finding_id: nas-012
    severity: high
    title: Falcon v1 under-scaled one positive-control curve despite a functioning directional canary
    description: The disclosed engineering amendment records that c_fndsa1024_fpr_emu detected the old 65,536-tick delay in the expected direction but reached the frozen t threshold in zero of three repeats, while its A/A-derived per-repeat directional diagnostics were approximately 156,523--196,831 ticks; this is an insufficient-power control result, not a target verdict or evidence of achieved power.
    evidence_ids: [nas-preregistration, nas-falcon-campaign-v1, nas-falcon-campaign-v2]
  - finding_id: nas-013
    severity: critical
    title: A mixed ML-KEM tuple contrast could be mislabeled or self-attested as secret-key evidence
    description: The legacy sk class changed a secret key, matching public ciphertext, and embedded public-key material together, while downstream acceptance trusted a producer-level passed boolean without reconstructing the complete target, calibration, A/A, placebo, and positive-control metadata matrix.
    evidence_ids: [nas-input-contract, nas-analysis, nas-primary-campaign, nas-diverse-campaign, nas-contract-tests]
dispositions:
  - finding_id: nas-001
    status: addressed
    rationale: The analyzer fail-closes on schema, run kind, exact commits, manifest and artifact hashes, host and boot identities, target sets, backend/protocol agreement, and promotion state.
    blocker: ""
    evidence_ids: [nas-analysis, nas-spec]
  - finding_id: nas-002
    status: addressed
    rationale: A valid FAIL on either host always yields combined risk-detected; secondary statistics are machine-marked non-overriding.
    blocker: ""
    evidence_ids: [nas-analysis, nas-tests]
  - finding_id: nas-003
    status: addressed
    rationale: The frozen analyzer implements repeat-level two-sided Welch contrasts, Holm within each preregistered family, and Q/I-squared warnings with deterministic output.
    blocker: ""
    evidence_ids: [nas-analysis, nas-spec, nas-tests]
  - finding_id: nas-004
    status: addressed
    rationale: Every signature row must have return code zero and consistent runtime contracts; constant lengths yield explicit null association rather than a fabricated coefficient.
    blocker: ""
    evidence_ids: [nas-analysis, nas-tests]
  - finding_id: nas-005
    status: addressed
    rationale: Blinded mode removes real component, target, family, axis, and input labels; unblinded mode verifies every blinded byte, and the canonical final-evidence root binds both output sets before postmeasurement approval.
    blocker: ""
    evidence_ids: [nas-analysis, nas-spec, nas-bundle, nas-tests]
  - finding_id: nas-006
    status: accepted-with-blocker
    rationale: Synthetic fixtures and deterministic checks make the implementation engineering-ready, while empirical and human claims remain explicitly unavailable.
    blocker: Run both accepted physical hosts under the final campaign, freeze the blinded outputs before unblinding, and obtain independent human statistical/artifact review.
    evidence_ids: [nas-analysis, nas-spec, nas-tests]
  - finding_id: nas-007
    status: addressed
    rationale: The independent official-dudect verifier reconstructs the pinned seed domains and recomputes the target tests, A/A, placebo, injected-delay detection fraction, A/A nominal sensitivity, and final timing validity from raw CSV artifacts before analysis can promote them.
    blocker: ""
    evidence_ids: [nas-dudect-verifier, nas-analysis]
  - finding_id: nas-008
    status: addressed
    rationale: Review readiness now reports premeasurement and postmeasurement reviewed commits separately; execution and same-corpus gates consume only the exact single premeasurement commit while preserving the union for reporting.
    blocker: ""
    evidence_ids: [nas-review-checker, nas-review-tests]
  - finding_id: nas-009
    status: addressed
    rationale: The preregistration now separates the per-repeat normal-approximation diagnostic, computed as (positive_abs_t_threshold + z(target_power)) times the A/A standard error, from the campaign's observed ceil(target_power times process_repeats) acceptance count. With target_power 0.8 and three repeats the latter is 3/3, not an estimate of 80% achieved campaign power; neither quantity bounds target leakage.
    blocker: ""
    evidence_ids: [nas-preregistration, nas-cli, nas-dudect-verifier, nas-control-tests]
  - finding_id: nas-010
    status: addressed
    rationale: The producer and independent verifier now count a positive-control detection only when class 1 is slower and t is at or below the negative frozen threshold; focused tests reject both a sub-threshold result and an equally large reversed result.
    blocker: ""
    evidence_ids: [nas-cli, nas-dudect-verifier, nas-control-tests, nas-campaign-tests]
  - finding_id: nas-011
    status: addressed
    rationale: The artifacts expose an A/A-derived effect for the actual directional gate, and both core-v3 and diverse-v2 manifests freeze a wide pre-final ML-DSA curve of 65,536, 262,144, and 1,048,576 clock ticks; tests pin the campaign override and independent diagnostic reconstruction.
    blocker: ""
    evidence_ids: [nas-cli, nas-dudect-verifier, nas-primary-campaign, nas-diverse-campaign, nas-campaign-tests]
  - finding_id: nas-012
    status: addressed
    rationale: Falcon v2 changes only c_fndsa1024_fpr_emu to the 65,536, 262,144, and 1,048,576-tick ladder, the v4 preregistration preserves the v3 Falcon amendment and marks v1 engineering traces non-promotable, the final analyzer routes Falcon evidence through v2, and regression tests pin both the changed target and all unchanged curves.
    blocker: ""
    evidence_ids: [nas-preregistration, nas-analysis, nas-falcon-campaign-v1, nas-falcon-campaign-v2, nas-paper-campaign-v4, nas-falcon-tests]
  - finding_id: nas-013
    status: addressed
    rationale: Core v3 and diverse v2 rename the endpoint valid_tuple and prohibit secret attribution. A shared fail-closed validator reconstructs the exact 21-trace contract, per-trace domain seeds, three-by-three positive matrix, and selected analysis metadata; the independent official verifier, native campaign validator, and paper analyzer all reject incomplete or forged reports. V1 diverse and v2 core engineering artifacts are explicitly non-reusable in paper v4.
    blocker: ""
    evidence_ids: [nas-input-contract, nas-dudect-verifier, nas-analysis, nas-primary-campaign, nas-diverse-campaign, nas-paper-campaign-v4, nas-contract-tests, nas-campaign-tests]

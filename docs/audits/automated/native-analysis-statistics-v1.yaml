limitations:
  - The same automated agent implemented and self-audited this analysis contract; this is not independent review.
  - P-values are secondary diagnostics and cannot declassify an official-dudect finding.
  - Synthetic fixtures do not predict native effect sizes or validate the two target CPU models.
  - The threshold-based effect value is a per-repeat A/A normal approximation for planning, not achieved campaign power or a bound on target leakage; the 3/3 rule is a separate observed acceptance gate.
  - The Falcon v1 0/3 result and 156,523--196,831-tick diagnostics are disclosed in the preregistration; this automated audit does not substitute for independent inspection of the raw engineering bundle.
  - The revised ML-DSA and Falcon curves still require successful final execution on both accepted physical hosts.
  - The portable ML-KEM engineering signal is mixed-input calibration only; it is neither final evidence nor a secret-key attribution.
  - No KyberSlash v3 physical trace exists at the audited commit; synthetic contract tests cannot establish operand-dependent latency.
  - The Korean project-history retrospective added at the audited commit is explanatory only and grants no statistical, timing, or human-review credit.
  - Evidence hashes expire on any referenced-file change.
human_gate_effect: none

  - consistency of summaries, raw states, repeat counts, sample counts, and timing statistics
findings:
  - finding_id: nsv10p-001
    severity: critical
    title: A paper summary could disagree with the underlying named analysis
    description: Counts, states, timing signals, t statistics, sample counts, repeats, component inventories, and frozen provenance must be checked together rather than copied independently.
    evidence_ids: [nsv10p-analysis, nsv10p-renderer, nsv10p-checker, nsv10p-tests]
  - finding_id: nsv10p-002
    severity: high
    title: Single-host evidence could be worded as cross-host reproducibility
    description: The paper must preserve host-scoped inference, Holm-family boundaries, and the absence of heterogeneity evidence.
    evidence_ids: [nsv10p-plan, nsv10p-analysis, nsv10p-claims, nsv10p-manuscript]
  - finding_id: nsv10p-003
    severity: high
    title: Final inferential values remain unavailable
    description: Structural validation and synthetic end-to-end tests cannot substitute for the physical V10 named analysis.
    evidence_ids: [nsv10p-plan, nsv10p-renderer, nsv10p-build]
dispositions:
  - finding_id: nsv10p-001
    status: addressed
    rationale: The renderer accepts only the exact named-analysis kind, 28 unique axes, one host, frozen commits and hashes, three repeats, positive sample counts, coherent states and signals, and matching summary totals; checker and mutation tests enforce deterministic regeneration.
    blocker: ""
    evidence_ids: [nsv10p-analysis, nsv10p-renderer, nsv10p-checker, nsv10p-tests, nsv10p-build]
  - finding_id: nsv10p-002
    status: addressed
    rationale: The plan, analyzer, claim matrix, and manuscript consistently describe host-scoped screening and prohibit cross-host or algorithm-wide inference.
    blocker: ""
    evidence_ids: [nsv10p-plan, nsv10p-analysis, nsv10p-claims, nsv10p-manuscript]
  - finding_id: nsv10p-003
    status: accepted-with-blocker
    rationale: Pending mode is explicit and the final checker rejects it unless the caller deliberately enables pre-result validation.
    blocker: Produce the complete physical single-host named analysis, pass the final build without the pending override, and manually inspect the rendered tables and claim wording.
    evidence_ids: [nsv10p-plan, nsv10p-renderer, nsv10p-checker, nsv10p-build]

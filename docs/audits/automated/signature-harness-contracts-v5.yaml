findings:
  - finding_id: shcr5-001
    severity: critical
    title: Earlier component failure could leave every signature path untested
    description: Sequential fail-fast execution provided no evidence that Falcon and diverse signature configs still compile or satisfy runtime protocol contracts.
    evidence_ids: [shcr5-orchestrator, shcr5-falcon, shcr5-diverse]
  - finding_id: shcr5-002
    severity: high
    title: A compile-only smoke would miss variable output and runtime randomness failures
    description: Signature paths require observed output length, return code, semantic randomness, raw protocol, build seal, and linked-binary checks before long controls are useful.
    evidence_ids: [shcr5-orchestrator, shcr5-tests]
  - finding_id: shcr5-003
    severity: high
    title: No full physical signature rehearsal has passed yet
    description: Static contracts do not establish that all Falcon and ML-DSA controls have stable headroom on the selected host.
    evidence_ids: [shcr5-profile, shcr5-falcon, shcr5-diverse]
dispositions:
  - finding_id: shcr5-001
    status: addressed
    rationale: The smoke scheduler treats each of the 28 axes independently, records failure without aborting, and the controls scheduler continues through all four components and three baselines.
    blocker: ""
    evidence_ids: [shcr5-orchestrator, shcr5-tests]
  - finding_id: shcr5-002
    status: addressed
    rationale: Runtime smoke executes four target rows and validates raw count, protocol metadata, signature return/output witnesses, semantic randomness, build seal, and optional linked-binary contract.
    blocker: ""
    evidence_ids: [shcr5-orchestrator, shcr5-tests]
  - finding_id: shcr5-003
    status: accepted-with-blocker
    rationale: The audited source defines but has not executed the physical-host rehearsal.
    blocker: Obtain two complete blocker-free rehearsal reports, preserve full-API and non-conformance wording, and run the final signature axes from fresh roots.
    evidence_ids: [shcr5-profile, shcr5-falcon, shcr5-diverse]

schema_version: "1.0"
audit_id: automated-artifact-blind-integrity-v1
status: complete
title: Automated adversarial audit of final-artifact and analyst-blinding integrity
perspective: artifact-blind-integrity
automated_agent: true
human_reviewer: false
automated_agent_id: artifact-blind-audit
audited_at: "2026-08-10T11:43:02Z"
audited_commit: 55f1bf0f0eda949edd52cf36e04ca3a81de780ba
scope:
  - final two-host bundle provenance, host identity, hashes, run identity, and artifact reuse
  - resume and run-kind separation for engineering, pilot, and final campaigns
  - result-analyst label blinding, transfer records, unblinding order, and byte parity
  - separation between automated engineering audits and independent human review
  - paper v4 routing and isolated output roots for core v3, Falcon v2, and diverse v2 replacement evidence
  - prohibition on reusing Falcon/diverse v1 or committed-corpus v2 engineering artifacts in replacement final campaigns
  - mixed ML-KEM valid-tuple attribution limits, independent machine validation, and the dedicated pending human-review packet
findings:
  - finding_id: abi-001
    severity: critical
    title: Final bundle trusted self-declared host and component provenance
    description: CPU, physical-host identity, commit, component roots, and artifact reuse were not all cross-checked against immutable component reports.
    evidence_ids: [abi-bundle, abi-reproducer]
  - finding_id: abi-002
    severity: critical
    title: Resume could reuse artifacts across run kinds or changed host state
    description: A resumed final campaign could skip completed targets without a unique run identity and preserved host/run-kind contract.
    evidence_ids: [abi-native-runner]
  - finding_id: abi-003
    severity: critical
    title: Same-corpus evidence was not sufficiently bound to raw artifacts and host identity
    description: Promotion relied on reported result fields without a complete exact-commit, raw-hash, and physical-host cross-check across tools.
    evidence_ids: [abi-baseline-runner]
  - finding_id: abi-004
    severity: critical
    title: Blind rerun claims were checkboxes rather than an enforceable analyst workflow
    description: Real target names and an unstructured unblinding note could be exposed before analysis with no frozen byte-parity record.
    evidence_ids: [abi-unblinding-schema, abi-analysis]
  - finding_id: abi-005
    severity: high
    title: Execution was not inseparably tied to the premeasurement human-review gate
    description: A final-looking execution could begin with pending human packets and still create promotable-looking artifacts.
    evidence_ids: [abi-native-runner, abi-reproducer]
  - finding_id: abi-006
    severity: critical
    title: Independent human review is still external and incomplete
    description: Automated adversarial audits can reduce engineering mistakes but cannot supply the two independent human approvals required for final paper promotion.
    evidence_ids: [abi-human-manifest]
  - finding_id: abi-007
    severity: critical
    title: Postmeasurement approval was not bound to one canonical evidence root
    description: A reviewer could approve a bundle or analysis description without cryptographically binding every host hash manifest, ASM bundle, unblinding record, and blinded/named output byte.
    evidence_ids: [abi-final-root, abi-reproducer, abi-review-checker]
  - finding_id: abi-008
    severity: critical
    title: Paper-ready descendants could mutate evidence-critical files
    description: A broadly defined review-only descendant could change code, manifests, or analysis after verification while retaining an apparently valid postmeasurement approval.
    evidence_ids: [abi-reproducer, abi-review-checker]
  - finding_id: abi-009
    severity: critical
    title: Falcon v1 engineering calibration could be reused after the v2 protocol amendment
    description: Without a versioned manifest, paper-campaign, and preregistration boundary, the nonpromotable v1 calibration traces could be relabeled or incorporated into v2 final evidence even though the positive-control ladder changed after the engineering run.
    evidence_ids: [abi-falcon-v2-manifest, abi-paper-campaign-v4, abi-preregistration, abi-reproducer, abi-analysis]
  - finding_id: abi-010
    severity: critical
    title: Replacement campaigns could collide with or accept legacy engineering artifact roots
    description: Paper v4 needs distinct core-v3 and diverse-v2 roots, fresh final execution, and exact manifest identity checks so v1 diverse or v2 committed-corpus engineering traces cannot be resumed, relabeled, or substituted.
    evidence_ids: [abi-paper-campaign-v4, abi-paper-checker, abi-core-v3-manifest, abi-diverse-v2-manifest, abi-bundle, abi-native-runner, abi-reproducer, abi-analysis, abi-preregistration]
  - finding_id: abi-011
    severity: critical
    title: Mixed valid-tuple timing could be over-attributed to secret-key material
    description: Fixed-versus-fresh valid tuples vary the secret key, matching ciphertext, and embedded public-key material together, so artifact metadata or a timing signal cannot identify a secret-only cause.
    evidence_ids: [abi-input-contract, abi-core-v3-manifest, abi-diverse-v2-manifest, abi-paper-campaign-v4, abi-valid-tuple-review, abi-claim-matrix, abi-native-runner, abi-analysis]
  - finding_id: abi-012
    severity: critical
    title: Two-host final timing and blinded evidence do not yet exist
    description: The audited commit contains frozen schemas, validators, and pending review packets but no final runs from two distinct physical hosts, completed blinding record, named analysis, or canonical final-evidence root.
    evidence_ids: [abi-paper-campaign-v4, abi-bundle, abi-human-manifest, abi-claim-matrix, abi-reproducer, abi-final-root]
dispositions:
  - finding_id: abi-001
    status: addressed
    rationale: Bundle schema v4 cross-checks exact CPU and machine identity, non-overlapping host roots, per-host SHA256SUMS, component commit, unique run IDs, run kinds, and final promotion state.
    blocker: ""
    evidence_ids: [abi-bundle, abi-reproducer]
  - finding_id: abi-002
    status: addressed
    rationale: Native reports now bind run_kind and run_id, forbid final resume, preserve host fingerprints, and validate the expected commit and run kind.
    blocker: ""
    evidence_ids: [abi-native-runner]
  - finding_id: abi-003
    status: addressed
    rationale: Same-corpus schema v2 validates exact commit, final run kind, raw evidence hashes, tool capability, unique run identity, and the same physical host across all required tools.
    blocker: ""
    evidence_ids: [abi-baseline-runner, abi-reproducer]
  - finding_id: abi-004
    status: addressed
    rationale: Structured label maps, host-transfer hashes, ordered timestamps, an opaque analysis manifest, and blinded-to-unblinded byte parity replace the old checkbox claim.
    blocker: ""
    evidence_ids: [abi-unblinding-schema, abi-analysis, abi-reproducer]
  - finding_id: abi-005
    status: addressed
    rationale: Final run creation and final-bundle reproduction require a recorded ready human premeasurement gate; engineering and pilot runs remain nonpromotable.
    blocker: ""
    evidence_ids: [abi-native-runner, abi-reproducer]
  - finding_id: abi-006
    status: accepted-with-blocker
    rationale: The engineering workflow explicitly preserves this as a final external gate and grants no reviewer credit to any automated audit.
    blocker: Two independent named humans must review the exact frozen source/evidence hashes, including the new ML-KEM valid-tuple packet, and complete every required paper packet before final execution and promotion.
    evidence_ids: [abi-human-manifest, abi-valid-tuple-review, abi-review-checker]
  - finding_id: abi-007
    status: addressed
    rationale: Verification emits a canonical final-evidence manifest whose root binds the bundle, both host hash manifests, ASM evidence, unblinding record, and exact blinded/named output sets; postmeasurement reviewers must approve that root.
    blocker: ""
    evidence_ids: [abi-final-root, abi-reproducer, abi-review-checker]
  - finding_id: abi-008
    status: addressed
    rationale: Between verification C and review completion R1, the sole permitted changed path is the native-promotion packet; both reproduction and analysis validators independently reject any other descendant change.
    blocker: ""
    evidence_ids: [abi-reproducer, abi-review-checker]
  - finding_id: abi-009
    status: addressed
    rationale: Falcon v2, paper campaign v4, and the amended preregistration classify every v1 trace as engineering calibration only, require fresh final output roots on both hosts, and forbid artifact reuse or final resume. The reproducer and analysis loader bind the Falcon component to the exact falcon-native-v2 manifest and campaign identity, so a falcon-native-v1 report cannot satisfy the v2 final boundary.
    blocker: ""
    evidence_ids: [abi-falcon-v2-manifest, abi-paper-campaign-v4, abi-preregistration, abi-reproducer, abi-analysis]
  - finding_id: abi-010
    status: addressed
    rationale: The paper-v4 checker pins core v3 to committed-corpus-v3 and diverse v2 to diverse-v2. Final runs reject resume and non-empty roots; reports bind campaign ID, manifest hash, commit, run ID, final run kind, and the human gate. Bundle, reproducer, and analyzer require the exact v3/v2 manifests and reject overlapping host/component paths and reused run identities, so legacy engineering reports cannot satisfy the replacement boundary.
    blocker: ""
    evidence_ids: [abi-paper-campaign-v4, abi-paper-checker, abi-core-v3-manifest, abi-diverse-v2-manifest, abi-bundle, abi-native-runner, abi-reproducer, abi-analysis, abi-preregistration]
  - finding_id: abi-011
    status: accepted-with-blocker
    rationale: Core v3 and diverse v2 use the machine axis valid_tuple, and both runner and analyzer reconstruct every preserved trace contract fail closed with secret_attribution_permitted=false. Paper v4 and the claim matrix prohibit secret attribution, while the dedicated review packet keeps the scientific interpretation gate external to automation.
    blocker: Two independent named humans must approve paper-mlkem-valid-tuple-v1 for the exact frozen source commit before any final valid-tuple measurement can start; a later signal must still be reported only as a mixed public-and-secret contrast.
    evidence_ids: [abi-input-contract, abi-core-v3-manifest, abi-diverse-v2-manifest, abi-paper-campaign-v4, abi-valid-tuple-review, abi-claim-matrix, abi-native-runner, abi-analysis, abi-review-checker]
  - finding_id: abi-012
    status: accepted-with-blocker
    rationale: The repository honestly marks the paper campaign premeasurement-frozen, all human packets pending, and the timing claim pending physical measurement. The bundle, analyzer, reproducer, and final-root schema are preparation contracts rather than evidence that execution occurred.
    blocker: Collect fresh final artifacts at the audited/reviewed commit on two distinct non-virtualized physical x86_64 hosts, complete the frozen blinding and unblinding workflow, generate the canonical final-evidence root, and obtain postmeasurement human approval of that exact root.
    evidence_ids: [abi-paper-campaign-v4, abi-bundle, abi-human-manifest, abi-claim-matrix, abi-reproducer, abi-final-root]

schema_version: "1.0"
audit_id: automated-artifact-blind-integrity-v1
status: complete
title: Automated adversarial audit of final-artifact and analyst-blinding integrity
perspective: artifact-blind-integrity
automated_agent: true
human_reviewer: false
automated_agent_id: artifact-blind-audit
audited_at: "2026-08-10T09:20:29Z"
audited_commit: 48791fc170e65bf117d029eae80bb3397e2198e5
scope:
  - final two-host bundle provenance, host identity, hashes, run identity, and artifact reuse
  - resume and run-kind separation for engineering, pilot, and final campaigns
  - result-analyst label blinding, transfer records, unblinding order, and byte parity
  - separation between automated engineering audits and independent human review
  - versioned separation of Falcon v1 engineering calibration from Falcon v2 final evidence
findings:
  - finding_id: abi-001
    severity: critical
    title: Final bundle trusted self-declared host and component provenance
    description: CPU, physical-host identity, commit, component roots, and artifact reuse were not all cross-checked against immutable component reports.
    evidence_ids: [abi-bundle, abi-reproducer]
  - finding_id: abi-002
    severity: critical
    title: Resume could reuse artifacts across run kinds or changed host state
    description: A resumed final campaign could skip completed targets without a unique run identity and preserved host/run-kind contract.
    evidence_ids: [abi-native-runner]
  - finding_id: abi-003
    severity: critical
    title: Same-corpus evidence was not sufficiently bound to raw artifacts and host identity
    description: Promotion relied on reported result fields without a complete exact-commit, raw-hash, and physical-host cross-check across tools.
    evidence_ids: [abi-baseline-runner]
  - finding_id: abi-004
    severity: critical
    title: Blind rerun claims were checkboxes rather than an enforceable analyst workflow
    description: Real target names and an unstructured unblinding note could be exposed before analysis with no frozen byte-parity record.
    evidence_ids: [abi-unblinding-schema, abi-analysis]
  - finding_id: abi-005
    severity: high
    title: Execution was not inseparably tied to the premeasurement human-review gate
    description: A final-looking execution could begin with pending human packets and still create promotable-looking artifacts.
    evidence_ids: [abi-native-runner, abi-reproducer]
  - finding_id: abi-006
    severity: critical
    title: Independent human review is still external and incomplete
    description: Automated adversarial audits can reduce engineering mistakes but cannot supply the two independent human approvals required for final paper promotion.
    evidence_ids: [abi-human-manifest]
  - finding_id: abi-007
    severity: critical
    title: Postmeasurement approval was not bound to one canonical evidence root
    description: A reviewer could approve a bundle or analysis description without cryptographically binding every host hash manifest, ASM bundle, unblinding record, and blinded/named output byte.
    evidence_ids: [abi-final-root, abi-reproducer, abi-review-checker]
  - finding_id: abi-008
    severity: critical
    title: Paper-ready descendants could mutate evidence-critical files
    description: A broadly defined review-only descendant could change code, manifests, or analysis after verification while retaining an apparently valid postmeasurement approval.
    evidence_ids: [abi-reproducer, abi-review-checker]
  - finding_id: abi-009
    severity: critical
    title: Falcon v1 engineering calibration could be reused after the v2 protocol amendment
    description: Without a versioned manifest, paper-campaign, and preregistration boundary, the nonpromotable v1 calibration traces could be relabeled or incorporated into v2 final evidence even though the positive-control ladder changed after the engineering run.
    evidence_ids: [abi-falcon-v2-manifest, abi-paper-campaign-v3, abi-preregistration, abi-reproducer, abi-analysis]
dispositions:
  - finding_id: abi-001
    status: addressed
    rationale: Bundle schema v4 cross-checks exact CPU and machine identity, non-overlapping host roots, per-host SHA256SUMS, component commit, unique run IDs, run kinds, and final promotion state.
    blocker: ""
    evidence_ids: [abi-bundle, abi-reproducer]
  - finding_id: abi-002
    status: addressed
    rationale: Native reports now bind run_kind and run_id, forbid final resume, preserve host fingerprints, and validate the expected commit and run kind.
    blocker: ""
    evidence_ids: [abi-native-runner]
  - finding_id: abi-003
    status: addressed
    rationale: Same-corpus schema v2 validates exact commit, final run kind, raw evidence hashes, tool capability, unique run identity, and the same physical host across all required tools.
    blocker: ""
    evidence_ids: [abi-baseline-runner, abi-reproducer]
  - finding_id: abi-004
    status: addressed
    rationale: Structured label maps, host-transfer hashes, ordered timestamps, an opaque analysis manifest, and blinded-to-unblinded byte parity replace the old checkbox claim.
    blocker: ""
    evidence_ids: [abi-unblinding-schema, abi-analysis, abi-reproducer]
  - finding_id: abi-005
    status: addressed
    rationale: Final run creation and final-bundle reproduction require a recorded ready human premeasurement gate; engineering and pilot runs remain nonpromotable.
    blocker: ""
    evidence_ids: [abi-native-runner, abi-reproducer]
  - finding_id: abi-006
    status: accepted-with-blocker
    rationale: The engineering workflow explicitly preserves this as a final external gate and grants no reviewer credit to any automated audit.
    blocker: Two independent named humans must review the exact frozen source/evidence hashes and complete every required paper packet before final execution and promotion.
    evidence_ids: [abi-human-manifest]
  - finding_id: abi-007
    status: addressed
    rationale: Verification emits a canonical final-evidence manifest whose root binds the bundle, both host hash manifests, ASM evidence, unblinding record, and exact blinded/named output sets; postmeasurement reviewers must approve that root.
    blocker: ""
    evidence_ids: [abi-final-root, abi-reproducer, abi-review-checker]
  - finding_id: abi-008
    status: addressed
    rationale: Between verification C and review completion R1, the sole permitted changed path is the native-promotion packet; both reproduction and analysis validators independently reject any other descendant change.
    blocker: ""
    evidence_ids: [abi-reproducer, abi-review-checker]
  - finding_id: abi-009
    status: addressed
    rationale: Falcon v2, paper campaign v3, and the amended preregistration classify every v1 trace as engineering calibration only, require fresh final output roots on both hosts, and forbid artifact reuse or final resume. The reproducer and analysis loader now bind the Falcon component to the exact falcon-native-v2 manifest and campaign identity, so a falcon-native-v1 report cannot satisfy the v2 final boundary.
    blocker: ""
    evidence_ids: [abi-falcon-v2-manifest, abi-paper-campaign-v3, abi-preregistration, abi-reproducer, abi-analysis]

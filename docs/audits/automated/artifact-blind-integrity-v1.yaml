limitations:
  - This audit was performed by an automated agent and is not an independent human review.
  - Human access ordering is supported by hashes and attestations but cannot be proven solely by software.
  - No two-host final timing corpus, completed unblinding record, named final analysis, or canonical final-evidence root exists in the audited commit.
  - Valid-tuple metadata authenticates the declared mixed-input contract but cannot turn that mixed contrast into causal secret attribution.
  - Pre/post seal checks assume the accepted physical host and operating system are not actively malicious; they are provenance and mutation guards, not remote attestation.
  - The Korean project-history retrospective added at the audited commit is explanatory only and grants no measurement, artifact, or human-review credit.
  - Evidence hashes expire on any referenced-file change and require a fresh automated audit disposition.
human_gate_effect: none

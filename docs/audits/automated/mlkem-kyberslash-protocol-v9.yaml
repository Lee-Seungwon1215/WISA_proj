findings:
  - finding_id: mkv10p-001
    severity: critical
    title: Post-diagnostic calibration or publication wording could change the protocol claim
    description: The uniform fast-control amendment and the mixed-input, public-input, and operand-canary boundaries must remain visible through publication.

    evidence_ids: [mkv10p-core, mkv10p-kyberslash, mkv10p-claims, mkv10p-manuscript]
  - finding_id: mkv10p-002
    status: addressed
    rationale: The renderer requires exactly ten KyberSlash axes within the exact 28-axis inventory and emits per-axis status rather than an algorithm-wide verdict; checker and tests fail closed on drift.
    blocker: ""
    evidence_ids: [mkv10p-renderer, mkv10p-manuscript, mkv10p-checker, mkv10p-tests]
  - finding_id: mkv10p-003
    status: addressed
    rationale: The generated tables retain all mixed valid-tuple, ciphertext-only, FO, chosen-ciphertext, and operand-bin axes; the prose explicitly limits the three risk signals to mixed input attribution and preserves the negative host-scoped KyberSlash observations without erasing static division evidence.
    blocker: ""
    evidence_ids: [mkv10p-native-results, mkv10p-manuscript, mkv10p-post-plan, mkv10p-renderer]

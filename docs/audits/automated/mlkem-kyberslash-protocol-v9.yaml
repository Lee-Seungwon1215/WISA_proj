  - finding_id: mkv10p-002
    severity: high
    title: Aggregation could hide KyberSlash axes or imply algorithm-wide leakage
    description: The paper path must retain all ten KyberSlash axes, exact component totals, per-axis states, and explicit site-level interpretation limits.
    evidence_ids: [mkv10p-renderer, mkv10p-manuscript, mkv10p-checker, mkv10p-tests]
  - finding_id: mkv10p-003
    severity: high
    title: Large mixed valid-tuple signals could be misrepresented as secret-only leakage
    description: The three final risk states jointly vary matching public and secret material, while every KyberSlash physical axis is a no-finding observation on one host; neither result supports key recovery or an algorithm-wide verdict.
    evidence_ids: [mkv10p-native-results, mkv10p-manuscript, mkv10p-post-plan]
dispositions:
  - finding_id: mkv10p-001
    status: addressed
    rationale: The frozen profiles, claim matrix, and manuscript preserve the uniform calibration rule and distinguish valid-tuple, chosen-ciphertext, and operand-latency interpretations.

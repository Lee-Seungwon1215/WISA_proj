  - general KEM dual-read masked class materialization before t0
  - KyberSlash operand-v3 same-address arithmetic setup and valid placebo boundary
  - ML-KEM valid-tuple and public chosen-ciphertext attribution limits
findings:
  - finding_id: mkp7-001
    severity: critical
    title: General KEM pool selection carried class-dependent pointer-branch state into t0
    description: The v6 setup placebo added normalization copies and could not exclude predictor state left by the target-mode class pointer choice.
    evidence_ids: [mkp7-preregistration, mkp7-kem-template, mkp7-cli]
  - finding_id: mkp7-002
    severity: high
    title: The general fix must not weaken the specialized operand-v3 contract
    description: KyberSlash operand canaries require one fixed key, one ciphertext work address, arithmetic coefficient selection, a valid placebo, and exact linked-binary attribution.
    evidence_ids: [mkp7-kyberslash, mkp7-kem-template]
  - finding_id: mkp7-003
    severity: high
    title: Mixed valid-tuple signals still cannot be called secret-key leakage
    description: Both secret and matching public material vary on the valid-tuple axis regardless of the corrected setup implementation.
    evidence_ids: [mkp7-plan, mkp7-preregistration]
  - finding_id: mkp7-004
    severity: high
    title: Fresh v7 ML-KEM and KyberSlash timing evidence is pending
    description: Correct code and static contracts do not substitute for final physical traces and controls.
    evidence_ids: [mkp7-plan]
dispositions:
  - finding_id: mkp7-001
    status: addressed
    rationale: Non-operand KEM traces now read both pool slots, select through a no-inline volatile mask into shared work buffers, record dual-read-masked-select-v4, and fail validity on contract drift.
    blocker: ""
    evidence_ids: [mkp7-kem-template, mkp7-common-template, mkp7-cli]
  - finding_id: mkp7-002
    status: addressed
    rationale: The operand-v3 branch remains separate and preserves its same-address-branchless-v3 metadata, coefficient witnesses, valid placebo value, return-code gate, and binary contract.
    blocker: ""
    evidence_ids: [mkp7-kyberslash, mkp7-kem-template]
  - finding_id: mkp7-003
    status: addressed
    rationale: V7 retains explicit mixed-input attribution limits in both the plan and preregistration.
    blocker: ""
    evidence_ids: [mkp7-plan, mkp7-preregistration]
  - finding_id: mkp7-004
    status: accepted-with-blocker
    rationale: The audited commit is a premeasurement freeze.
    blocker: Execute every v7 ML-KEM and KyberSlash axis in fresh final roots and pass correctness, setup, controls, binary contracts, hashes, and named analysis.
    evidence_ids: [mkp7-plan, mkp7-kyberslash]

scope:
  - interpretation of the complete failed V2-A control rehearsal
  - null-control validity, positive-control headroom, and post-diagnostic calibration
  - operational-repeat, multiplicity, single-host, and final-inference boundaries
findings:
  - finding_id: nsv10-001
    severity: critical
    title: Null t statistics are not monotone headroom measures
    description: Requiring absolute t below 3.5 on each of 168 null checks, in addition to the unchanged final 4.5 rule, creates avoidable family-wise rejection and encourages rerun-until-pass selection.
    evidence_ids: [nsv10-calibration, nsv10-profile, nsv10-prereg]
  - finding_id: nsv10-002
    severity: critical
    title: The V2-A target traces must not select the V10 method
    description: Reduced 1000-sample target t scores, statuses, directions, consistency, and baseline outcomes are non-inferential and cannot choose parameters or conclusions.
    evidence_ids: [nsv10-calibration, nsv10-checker, nsv10-tests]
  - finding_id: nsv10-003
    severity: high
    title: Two same-seed rehearsals are not independent inferential replicates
    description: Different wall-clock times and run IDs demonstrate operational rerun behavior but do not provide independent null draws, host replication, or additional paper sample size.
    evidence_ids: [nsv10-profile, nsv10-contract, nsv10-prereg, nsv10-claims]
  - finding_id: nsv10-004
    severity: high
    title: Qualification reports could be duplicated or cross-host
    description: Final launch must independently bind exact hashes, distinct IDs, one commit, one physical identity, one CPU affinity, and frozen SMT/turbo state.
    evidence_ids: [nsv10-rehearsal, nsv10-native-runner, nsv10-rehearsal-tests, nsv10-native-tests]
  - finding_id: nsv10-005
    severity: high
    title: V10 inferential results remain unavailable
    description: Rehearsals cannot supply final target findings, Holm-adjusted contrasts, output-length diagnostics, or cross-host evidence.
    evidence_ids: [nsv10-plan, nsv10-analysis, nsv10-claims]
dispositions:
  - finding_id: nsv10-001
    status: addressed
    rationale: V3 removes only the unsupported 3.5 rehearsal margin and requires zero failures under the unchanged final absolute-t-below-4.5 rule; counts, seeds, repeats, and final thresholds remain unchanged.
    blocker: ""
    evidence_ids: [nsv10-calibration, nsv10-profile, nsv10-prereg, nsv10-checker]
  - finding_id: nsv10-002
    status: addressed
    rationale: The calibration enumerates forbidden target inputs, freezes the exact V2-A blocker matrix, and the checker accepts only the manifest-shape rule and exact 13 old/new control ladders.
    blocker: ""
    evidence_ids: [nsv10-calibration, nsv10-checker, nsv10-tests]
  - finding_id: nsv10-003
    status: addressed
    rationale: Profile, preregistration, claim matrix, and operator contract call the two runs operational reruns and explicitly prohibit treating them as independent inferential replicates.
    blocker: ""
    evidence_ids: [nsv10-profile, nsv10-contract, nsv10-prereg, nsv10-claims]
  - finding_id: nsv10-004
    status: addressed
    rationale: Qualification and final launch separately reopen both complete reports and reject duplicate IDs, source mutation, commit drift, cross-host identity, CPU-affinity drift, or non-frozen SMT/turbo readbacks.
    blocker: ""
    evidence_ids: [nsv10-rehearsal, nsv10-native-runner, nsv10-rehearsal-tests, nsv10-native-tests]
  - finding_id: nsv10-005
    status: accepted-with-blocker
    rationale: The campaign and claim matrix remain pending-physical-measurement and prohibit constant-time or cross-host claims.
    blocker: After two clean V3 rehearsals, collect every fresh V10 final axis and baseline, build the preserved single-host bundle, and run deterministic named analysis before populating a paper result table.
    evidence_ids: [nsv10-plan, nsv10-analysis, nsv10-claims]

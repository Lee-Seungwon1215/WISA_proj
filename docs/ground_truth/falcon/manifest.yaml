          F: {offset: 1281, length: 1024, tainted: true}
  c_fndsa:
    upstream: https://github.com/pornin/c-fn-dsa
    revision: 729698f031ea69bd33375d2fb0db3ac154ad1880
    role: constant-time-comparator
    standard_identity: prospective-fn-dsa
    conformance: none
    import_path: examples/fndsa_prospective/upstream
    upstream_path: repository root
    tree_sha256: 0fd17c0d7a05650657b8660496d3fd15b5d2ef907a520dfa48b0688800298429
    api_state_model: encoded-keys-only
    profiles:
      native_fp:
        harness: sign_native_fp
        required_flags:
          - -D_GNU_SOURCE
          - -DFNDSA_AVX2=0
        forbidden_forced_flags:
          - -DFNDSA_SSE2=0
          - -DFNDSA_NEON=0
          - -DFNDSA_RV64D=0
        activation_rule: exactly one architecture-native FP backend must be active
      integer_fpr:
        harness: sign_fpr_emu
        required_flags:
          - -D_GNU_SOURCE
          - -DFNDSA_AVX2=0
          - -DFNDSA_SSE2=0
          - -DFNDSA_NEON=0
          - -DFNDSA_RV64D=0
          - -DFNDSA_DIV_EMU=1
          - -DFNDSA_SQRT_EMU=1
        activation_rule: sign_fpr.c software binary64 and integer post-sampling path
    degrees:
      "512":
        target: c_fndsa512_prospective
        config: examples/c_fndsa512_prospective/ctkat.yaml
        boundary_config: examples/c_fndsa512_prospective/ctkat_boundaries.yaml
        split_config: examples/c_fndsa512_prospective/ctkat_split.yaml

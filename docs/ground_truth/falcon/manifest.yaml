        verifying_key_bytes: 897
        signature_bytes: 666
        taint:
          header: {offset: 0, length: 1, tainted: false}
          encoded_f_g_F: {offset: 1, length: 1280, tainted: true}
          hashed_verifying_key: {offset: 1281, length: 64, tainted: false}
      "1024":
        target: c_fndsa1024_prospective
        config: examples/c_fndsa1024_prospective/ctkat.yaml
        boundary_config: examples/c_fndsa1024_prospective/ctkat_boundaries.yaml
        split_config: examples/c_fndsa1024_prospective/ctkat_split.yaml
        logn: 10
        signing_key_bytes: 2369
        verifying_key_bytes: 1793
        signature_bytes: 1280
        taint:
          header: {offset: 0, length: 1, tainted: false}
          encoded_f_g_F: {offset: 1, length: 2304, tainted: true}
          hashed_verifying_key: {offset: 2305, length: 64, tainted: false}

deterministic_kat:
  method: seeded-keygen-seeded-sign-full-pk-sk-signature-transcript
  adapter: examples/fndsa_prospective/adapter.c
  source: examples/fndsa_prospective/kat.c
  message_bytes: 64
  profiles_must_match: true
  degrees:
    "512":
      transcript_bytes: 2908
      transcript_sha256: 1e6b170d888636fac55998a484e55f8618021dea4048a29e18319fc236926202
    "1024":
      transcript_bytes: 5442
      transcript_sha256: 0873863edfb22be25f874b07d450da695348ae6400be5c8f9521001a018c9bb2

boundaries:
  encoded_key_decode:
    pqclean: [trim_i8_decode]
    c_fndsa: [trim_i8_decode]
    taint_origins: [encoded-f, encoded-g, encoded-F]
  private_key_completion:
    pqclean: [complete_private]
    c_fndsa: [mqpoly_div_ntt, mqpoly_int_to_small]
    output: expanded-G
  sampler_core:
    pqclean: [ffSampling_fft, sampler, BerExp]
    c_fndsa: [ffsamp_fft, sampler_next, ber_exp]
    taint_origins: [expanded-basis, signing-randomness]
  signing_acceptance_loop:
    pqclean: [do_sign_dyn, do_sign_tree]
    c_fndsa: [sign_core]
    c_fndsa_bound: 27
  signature_encoding:
    pqclean: [comp_encode]
    c_fndsa: [comp_encode]
    pqclean_output: compressed-variable-length
    c_fndsa_output: fixed-size-padded
  full_sign_api:
    pqclean: [crypto_sign_signature]
    c_fndsa: [fndsa_sign_seeded]
  expanded_key_api:
    pqclean: internal-tree-probe-only
    c_fndsa: unavailable-in-public-c-api-at-pinned-revision

floating_point_contract:
  representation: IEEE-754 binary64 with roundTiesToEven
  upstream_source: examples/fndsa_prospective/upstream/sign_inner.h
  excluded_values: [NaN, infinity, denormal]
  native_rounding_controls:
    x86_64: SSE2 rounding mode saved, set to nearest, and restored
    aarch64: NEON round-to-nearest with denormal flush accepted by upstream
  opcode_rule: presence is a build fact, never a leak verdict by itself
  runtime_screen:
    method: clear and inspect invalid/div-by-zero/overflow/underflow FP exceptions around seeded signing
    scope: deterministic KAT only
    limitation: no exception is not a proof that every possible key avoids exceptional values

versioned_evidence:
  structural_snapshot: docs/ground_truth/falcon/structural_evidence_x86_64.yaml
  floating_point_audit: docs/ground_truth/falcon/fp_audit_x86_64.json
  raw_report_policy: generated-under-examples-and-gitignored

evidence_policy:
  structural: ordinary Valgrind branch/address/undefined-value screen
  fp_audit: compiler output opcode and unresolved-library-call inventory
  physical_timing: not-run
  timing_blocker: blocked-by-native-linux-host
  promotion_rule: no timing or conformance claim may be inferred from build, KAT, structural, or opcode evidence

        secret_key_bytes: 1281
        encoded_components:
          header: {offset: 0, length: 1, tainted: false}
          f: {offset: 1, length: 384, tainted: true}
          g: {offset: 385, length: 384, tainted: true}
          F: {offset: 769, length: 512, tainted: true}
      "1024":
        target: pqclean_falcon1024_reference
        config: examples/pqc_falcon1024/ctkat.yaml
        split_config: examples/pqc_falcon1024/ctkat_split.yaml
        import_path: examples/pqc_falcon1024/clean
        upstream_path: crypto_sign/falcon-1024/clean
        tree_sha256: c91baa9cc666a4b601cb793b362ab9b238755f15a530f4d54727588e099829bd
        secret_key_bytes: 2305
        encoded_components:
          header: {offset: 0, length: 1, tainted: false}

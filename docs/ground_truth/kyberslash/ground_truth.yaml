functional_equivalence:
  method: deterministic-randombytes-full-kem-transcript
  iterations: 8
  prng_seed: 0x4b59424552534c41
  transcript_bytes: 37888
  transcript_sha256: e5c93a35b4dfa171c56514ee260942079e59c802b1ac899e8f3d2b53e3b6cbf4
  expected: all-four-variants-byte-identical

expected_evidence:
  ordinary_memcheck:
    stock: no-finding
    ks1: no-finding
    ks2: no-finding
    ks1_ks2: no-finding
    historical:
      status: build-dependent-finding
      finding_type: SECRET_DEPENDENT_BRANCH
      finding_function: pqcrystals_kyber768_ref_poly_frommsg
      finding_cells: [clang_opt1, clang_size]
      no_finding_cells:
        - gcc_debug
        - gcc_opt1
        - gcc_release
        - gcc_opt3
        - gcc_size
        - clang_debug
        - clang_release
        - clang_opt3
    interpretation: >-
      Ordinary Memcheck does not model variable-latency operands. The four
      modern controls are structurally clean in the frozen x86_64 matrix. The
      historical source has a separate compiler-induced poly_frommsg branch in
      clang -O1/-Os; this is not a KyberSlash division finding.
  assembly:
    stock: []
    ks1: [PQCLEAN_MLKEM768_CLEAN_poly_tomsg]
    ks2:
      - PQCLEAN_MLKEM768_CLEAN_poly_compress
      - PQCLEAN_MLKEM768_CLEAN_polyvec_compress
    ks1_ks2:
      - PQCLEAN_MLKEM768_CLEAN_poly_tomsg
      - PQCLEAN_MLKEM768_CLEAN_poly_compress
      - PQCLEAN_MLKEM768_CLEAN_polyvec_compress
    historical:
      - pqcrystals_kyber768_ref_poly_tomsg
      - pqcrystals_kyber768_ref_poly_compress
      - pqcrystals_kyber768_ref_polyvec_compress
    interpretation: candidates depend on compiler, optimization, and architecture
  timecop:
    kem_dec_secret_key_path:
      stock: []
      ks1: [PQCLEAN_MLKEM768_CLEAN_poly_tomsg]
      ks2: []
      ks1_ks2: [PQCLEAN_MLKEM768_CLEAN_poly_tomsg]
      historical: [pqcrystals_kyber768_ref_poly_tomsg]
      interpretation: >-
        Undefinedness is seeded at secret-key regions. The KS2 operands are
        secret-derived in the algorithm, but Memcheck's undefinedness does not
        survive the recovered-message and hash/re-encryption boundary; absence
        here is a taint-propagation limitation and is not evidence of safety.
    site_operand_attribution:
      stock: []
      ks1: [PQCLEAN_MLKEM768_CLEAN_poly_tomsg]
      ks2:
        - PQCLEAN_MLKEM768_CLEAN_poly_compress
        - PQCLEAN_MLKEM768_CLEAN_polyvec_compress
      ks1_ks2:
        - PQCLEAN_MLKEM768_CLEAN_poly_tomsg
        - PQCLEAN_MLKEM768_CLEAN_poly_compress
        - PQCLEAN_MLKEM768_CLEAN_polyvec_compress
      historical:
        - pqcrystals_kyber768_ref_poly_tomsg
        - pqcrystals_kyber768_ref_poly_compress
        - pqcrystals_kyber768_ref_polyvec_compress
      interpretation: >-
        Undefinedness is seeded directly at the three polynomial operands.
        Exact function-set attribution requires the pinned patched backend and
        is operand evidence, not an end-to-end timing measurement.
  physical_timing:
    all_variants: not-run
    promotion_rule: never infer timing leakage from structural or operand attribution alone

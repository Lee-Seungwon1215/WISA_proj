status: pending
title: Same-corpus TIMECOP, MicroWalk, and official dudect comparison
review_phase: pre-measurement
source_revision_policy: exact-clean-git-head-at-review
scope:
  - {target: toy_kem_ct_leak, harness: leaky, build_scope: common-positive-control}
  - {target: toy_kem_ct_leak, harness: safe, build_scope: common-negative-control}
threat_model: Tool capability comparison on the same source, function, ciphertext axis, and positive/negative controls.

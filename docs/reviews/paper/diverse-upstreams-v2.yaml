observed_dependency: KAT, portable/native transcript equivalence, ELF machine identity, native symbols, instruction markers, explicit native backend headers, and the ML-DSA sign-to-verify gate.
declassification_predicate: none for CT claims; this packet only approves source/build provenance, timing-profile construction, and claim limits.

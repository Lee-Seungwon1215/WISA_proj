  - {target: mlkem_native_768_portable, harness: kem_dec_valid_tuple, build_scope: portable-paper-diverse-v2-valid-tuple-contract}
  - {target: mlkem_native_768_x86_64, harness: kem_dec_valid_tuple, build_scope: x86_64-paper-diverse-v2-valid-tuple-contract}
threat_model: Causal over-attribution of a mixed public-and-secret timing corpus to secret-key material alone.
secret_origin: The decapsulation secret key varies across classes, but matching public ciphertext and public-key material embedded in the secret key vary with it.
observed_dependency: Class 0 repeats one fixed valid tuple while class 1 selects fresh valid tuples; every setup call and encapsulation-to-decapsulation round trip is checked before timing.
declassification_predicate: None. The class construction does not identify a secret-only effect, so a valid-tuple signal must remain a mixed public-and-secret input contrast.
public_transcript: The matching public key and ciphertext, the declared class construction, per-trace domain seed, and untimed round-trip witness.
security_argument: Both reviewers inspect the generated class construction, exact runtime metadata contract, independent validator, frozen campaign routing, and explicit prohibition on secret attribution.
known_limitations:
  - The contrast cannot distinguish secret-key cost from public ciphertext, embedded public-key material, or their interaction.
  - Compile and round-trip success is not physical timing evidence.
  - A no-signal result remains limited to the selected input distribution and physical hosts.

threat_model: Secret-dependent branch, address, or variable-latency operand during ML-KEM decapsulation.
secret_origin: IND-CPA secret polynomial and FO rejection seed; embedded public key material is excluded.
observed_dependency: Assembly division candidates in public Keccak rate computations; legacy timing rows are non-decisional.
declassification_predicate: Candidate operands must be traced to public Keccak rate or other public transcript state for the exact build cell.
public_transcript: Public key, ciphertext, Keccak rate constants, and values derived solely from them.
security_argument: No candidate may clear solely by function name; both reviewers inspect source, disassembly, and attribution evidence.
known_limitations:
  - Correctness PASS must be refreshed before a no-finding paper claim.
  - Dynamic structural coverage does not include unexecuted paths.

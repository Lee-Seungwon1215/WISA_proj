threat_model: Secret-derived operands reaching variable-latency integer division even without secret branch or address findings.
secret_origin: Decapsulation secret polynomial coefficients and derived message/compression values.
observed_dependency: Patched TIMECOP attribution at KS1 and KS2 sites plus emitted division candidates by build cell.
declassification_predicate: none; confirmed secret-derived operands remain risk-detected.
public_transcript: Ciphertext and public key are public, but they do not declassify secret-derived division operands.
security_argument: Stock, isolated variants, combined variant, historical source, and patched control must remain distinguishable.
known_limitations:
  - Operand attribution is not physical latency evidence.
  - Chosen-ciphertext timing is a public-input contrast and does not by itself attribute a secret dependency.
  - Direct operand canaries isolate instruction latency and are not a full decapsulation attack.
  - Full key recovery is outside the pre-measurement claim.

schema_version: 2
matrix_id: ctkat-paper-claims-v10-single-host
terminology:
  screening_corpus: committed PQClean/c-fn-dsa target-by-build cells used for dynamic structural and assembly screening
  source_build_corpus: separately maintained upstream lineages and production integration cases used for provenance, build, KAT, and equivalence evidence
  timing_campaign: paper-native-v10 single-physical-host runs using timing-harness-v2, explicit runtime randomness contracts, branchless shared-buffer class setup, universal pre-measurement build seals, hard-gated SMT/turbo/governor/affinity state, and a machine-validated qualification from two clean operational control rehearsals; a plan, rehearsal, or CI build is never final timing evidence, the two rehearsals are not inferential replicates, and cross-host reproducibility is not claimed

claims:
  - id: fail-closed-evidence-fold
    statement: Missing correctness or invalid/confounded timing cannot produce a clean observation.
    status: implemented-premeasurement
    scope: evidence schema and committed corpus migration
    evidence:
      - ctkat/evidence.py
      - tests/test_evidence.py
      - docs/corpus/correctness_snapshot_v1.json
      - docs/corpus/corpus_summary.csv
    open_gates: []
    prohibited_wording: constant-time proof
  - id: build-matrix-sensitivity
    statement: A single release build surfaces fewer candidate pairs than the full compiler/optimization matrix in the committed screening corpus.
    status: implemented-premeasurement
    scope: committed screening corpus only
    evidence:
      - docs/ablation/generated/ablation_summary.json
      - docs/corpus/corpus_cells.csv
    open_gates: []
    prohibited_wording: universal tool accuracy
  - id: kyberslash-attribution
    statement: Stock, isolated KS1, isolated KS2, and combined full-KEM variants use one fixed key and public chosen-ciphertext pools, while three vulnerable/patched site pairs separately test operand-dependent hardware latency under exact linked-binary contracts. All ten primary axes produced no-finding-observed on the qualified Intel host; this host-scoped negative observation does not erase the statically identified division sites or establish an algorithm-wide constant-time property.
    status: supported-single-host
    scope: ML-KEM/Kyber-768 frozen variants
    evidence:
      - docs/ground_truth/kyberslash/ground_truth.yaml
      - docs/measurement/kyberslash_native_v5.yaml
      - docs/measurement/KYBERSLASH_NATIVE_V3.md
      - docs/reviews/paper/kyberslash-ground-truth-v2.yaml
      - paper/mdpi_working/generated/native_results.tex
      - paper/mdpi_working/generated/render_state.json
      - paper/mdpi_working/main.tex
    open_gates: []
    prohibited_wording: full attack or key recovery reproduced
  - id: falcon-comparator
    statement: Reference Falcon and prospective c-fn-dsa native-FP/integer-FPR profiles have exact provenance, separate full-signature timing targets, and measured-binary sampler contracts matched to their actual software-FPR/SSE2 structure. All six primary axes produced no-finding-observed on the qualified Intel host, and the three variable-length PQClean Falcon endpoints showed only very small within-class length correlations; neither observation is a sampler-core isolation or FIPS 206 conformance claim.
    status: supported-single-host
    scope: Falcon/FN-DSA 512 and 1024 comparators
    evidence:
      - docs/ground_truth/falcon/manifest.yaml
      - docs/measurement/falcon_native_v4.yaml
      - examples/falcon_comparator_support/timing_binary_contracts_v1.yaml
      - docs/reviews/paper/falcon-comparator-v2.yaml
      - paper/mdpi_working/generated/native_results.tex
      - paper/mdpi_working/generated/render_state.json
      - paper/mdpi_working/main.tex
    open_gates: []
    prohibited_wording: FIPS 206 conformance
  - id: diverse-upstream-builds
    statement: Four primary upstream lineages are represented, with mlkem-native and mldsa-native build/KAT/equivalence matrices prepared across x86_64 and AArch64.
    status: implemented-premeasurement
    scope: provenance and source/build evidence, not timing
    evidence:
      - docs/corpus/diverse_upstreams_v1.yaml
      - scripts/check_diverse_upstreams.py
      - docs/reviews/paper/diverse-upstreams-v2.yaml
    open_gates:
      - review both architecture artifact bundles
      - quantify or bound shared-code ancestry before stronger independence wording
    prohibited_wording: four from-scratch independent implementations
  - id: native-timing-results
    statement: Paper-grade v10 native timing completed on one physical x86_64 host with frozen controls, hard-gated SMT/turbo/governor/affinity state, and a qualification from two blocker-free operational control rehearsals at the exact measurement commit. The complete 28-axis analysis contains three risk-detected mixed ML-KEM valid-tuple axes and 25 no-finding-observed axes; valid-tuple signals vary matching public and secret material and are never reported as secret-only attribution. The rehearsals are not inferential replicates, and cross-host reproducibility is not claimed.
    status: supported-single-host
    scope: 28 predeclared timing axes plus all three same-corpus baseline tools
    evidence:
      - docs/measurement/paper_native_campaign_v10.yaml
      - docs/measurement/native_timing_v5_campaign.yaml
      - docs/measurement/NATIVE_TIMING_V3.md
      - docs/measurement/kyberslash_native_v5.yaml
      - docs/measurement/falcon_native_v4.yaml
      - docs/measurement/diverse_native_v4.yaml
      - docs/measurement/DIVERSE_NATIVE_V2.md
      - docs/measurement/paper_control_rehearsal_v1_calibration.yaml
      - docs/measurement/paper_control_rehearsal_v2_calibration.yaml
      - docs/measurement/paper_control_rehearsal_v3.yaml
      - docs/measurement/PAPER_CONTROL_REHEARSAL_V3.md
      - docs/measurement/EXPERIMENT_PREREGISTRATION.md
      - ctkat/timing_input_contract.py
      - ctkat/timing_build_provenance.py
      - scripts/check_paper_campaign.py
      - docs/measurement/PAPER_NATIVE_ANALYSIS_V2.md
      - paper/mdpi_working/generated/native_results.tex
      - paper/mdpi_working/generated/native_summary.tex
      - paper/mdpi_working/generated/render_state.json
      - paper/mdpi_working/main.tex
      - docs/paper/MDPI_POST_RESULT_WORK_PLAN_KO.md
    open_gates: []
    prohibited_wording: valid-tuple signal means secret-key leakage; no finding means proven constant-time

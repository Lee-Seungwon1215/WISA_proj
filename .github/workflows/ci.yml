name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest --cov=ctkat --cov-report=term-missing

  quality:
    name: Quality and artifact integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.17"
          enable-cache: false
      - run: python -m pip install -e ".[quality]"
      - run: uv lock --check
      - run: uv export --frozen --no-header --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/runtime.lock" && cmp requirements/runtime.lock "$RUNNER_TEMP/runtime.lock"
      - run: uv export --frozen --no-header --no-dev --extra dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/artifact.lock" && cmp requirements/artifact.lock "$RUNNER_TEMP/artifact.lock"
      - run: ruff check ctkat scripts tests
      - run: ruff format --check ctkat scripts tests
      - run: mypy ctkat
      - run: python scripts/check_corpus.py
      - run: python scripts/check_corpus_correctness.py --verify-snapshot
      - run: python scripts/migrate_evidence_v1_to_v2.py --check
      - run: python scripts/render_readme_corpus.py --check
      - run: python scripts/check_third_party.py
      - run: python scripts/check_example_configs.py
      - run: python scripts/check_kyberslash_ground_truth.py
      - run: python scripts/check_falcon_comparators.py
      - run: python scripts/check_diverse_upstreams.py
      - run: python scripts/run_native_timing_campaign.py --check
      - run: python scripts/run_native_timing_campaign.py --manifest docs/measurement/kyberslash_native_v2.yaml --check
      - run: python scripts/run_native_timing_campaign.py --manifest docs/measurement/falcon_native_v2.yaml --check
      - run: python scripts/run_native_timing_campaign.py --manifest docs/measurement/diverse_native_v1.yaml --check
      - run: python scripts/calibrate_timing_backend.py --check
      - run: python scripts/run_same_corpus_baselines.py --check
      - run: python scripts/check_asm_evidence.py --static
      - run: python scripts/check_automated_audits.py
      - run: python scripts/check_paper_campaign.py
      - run: python scripts/check_paper_reviews.py
      - run: python scripts/run_ablation.py --check
      - run: python scripts/build_paper_artifacts.py --check

  mlkem-asm-evidence:
    name: ML-KEM assembly evidence / 660 cells
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact native tool classes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang binutils
          python -m pip install .
      - name: Build and independently reproduce every frozen cell
        run: |
          python scripts/build_asm_evidence.py \
            --output-root "$RUNNER_TEMP/mlkem-asm-evidence"
          python scripts/check_asm_evidence.py \
            --bundle "$RUNNER_TEMP/mlkem-asm-evidence/asm_evidence_bundle.json"
      - name: Upload the complete independently-verifiable evidence tree
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mlkem-asm-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/mlkem-asm-evidence
          if-no-files-found: error

  package:
    name: Wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[release]"
      - name: Hash source-checkout renders
        run: PYTHONPATH=. python scripts/smoke_installed_package.py > "$RUNNER_TEMP/source.json"
      - run: python -m build
      - run: python scripts/check_distribution.py dist
      - run: python -m twine check dist/*
      - name: Clean wheel install outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/ctkat" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py" > installed-wheel.json
          diff source.json installed-wheel.json
          "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_official_backend.py" \
            --workdir "$RUNNER_TEMP/official-backend-smoke"
          "$RUNNER_TEMP/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_timing_harness_v2.py" \
            --repo "$GITHUB_WORKSPACE" \
            --workdir "$RUNNER_TEMP/timing-harness-v2-smoke"
      - name: Clean sdist install outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/ctkat" --version
          "$RUNNER_TEMP/sdist-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_package.py" > installed-sdist.json
          diff source.json installed-sdist.json
          "$RUNNER_TEMP/sdist-venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_official_backend.py" \
            --workdir "$RUNNER_TEMP/official-backend-sdist-smoke"

  linux-screen:
    name: Installed wheel / Valgrind / gcc+clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install native screening tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valgrind gcc clang binutils
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install dist/*.whl
      - name: Run shell-free end-to-end release target
        run: |
          cd "$RUNNER_TEMP"
          ctkat screen \
            --config "$GITHUB_WORKSPACE/examples/toy_release_smoke/ctkat.yaml" \
            --asm-cc gcc --asm-cc clang
          grep -q ',no-finding-observed,' \
            "$GITHUB_WORKSPACE/examples/toy_release_smoke/reports/screen_summary.csv"

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag ctkat-ci .
      - run: docker run --rm ctkat-ci ctkat --version

  kyberslash-timecop:
    name: KyberSlash TIMECOP attribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build pinned patched Valgrind backend
        run: docker build --target timecop --tag ctkat-timecop-ci .
      - name: Run backend canary and five-target attribution
        run: |
          mkdir -p "$RUNNER_TEMP/kyberslash-timecop"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/kyberslash-timecop:/results" \
            -w /workspace \
            ctkat-timecop-ci \
            python scripts/run_kyberslash_timecop.py --output-root /results
      - name: Run same-corpus positive and negative controls
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/kyberslash-timecop:/results" \
            -w /workspace \
            ctkat-timecop-ci \
            python scripts/run_same_corpus_baselines.py \
              --run-timecop \
              --run-kind engineering \
              --output-root /results/same-corpus
      - name: Upload lossless attribution report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kyberslash-timecop-${{ github.sha }}
          path: ${{ runner.temp }}/kyberslash-timecop
          if-no-files-found: error

  same-corpus-microwalk:
    name: Same-corpus MicroWalk PinTracer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Run pinned PinTracer positive and negative controls
        run: |
          python scripts/run_same_corpus_baselines.py \
            --run-microwalk \
            --run-kind engineering \
            --microwalk-timeout 900 \
            --output-root "$RUNNER_TEMP/same-corpus-microwalk"
      - name: Upload lossless MicroWalk report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: same-corpus-microwalk-${{ github.sha }}
          path: ${{ runner.temp }}/same-corpus-microwalk
          if-no-files-found: error

  diverse-native-upstreams:
    name: Diverse upstreams / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install matrix tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang binutils
          python -m pip install "pyyaml>=6,<7"
      - name: Build, execute, and compare all 120 architecture cells
        run: |
          python scripts/check_diverse_upstreams.py \
            --run-build-matrix \
            --output-root "$RUNNER_TEMP/diverse-${{ matrix.architecture }}"
          python scripts/check_diverse_upstreams.py \
            --validate-result \
            "$RUNNER_TEMP/diverse-${{ matrix.architecture }}/native-upstreams-${{ matrix.architecture }}.json"
      - name: Upload build, KAT, equivalence, and asm evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diverse-upstreams-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/diverse-${{ matrix.architecture }}/native-upstreams-${{ matrix.architecture }}.json
            ${{ runner.temp }}/diverse-${{ matrix.architecture }}/artifacts/*/deterministic-smoke
            ${{ runner.temp }}/diverse-${{ matrix.architecture }}/artifacts/*/upstream-kat
            ${{ runner.temp }}/diverse-${{ matrix.architecture }}/artifacts/*/native.o
          if-no-files-found: error

  openssl-pqc-integration:
    name: OpenSSL 3.5.7 PQ production API
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact-release build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc clang make perl
          python -m pip install "pyyaml>=6,<7"
      - name: Build exact OpenSSL and execute six PQ provider operations
        run: |
          python scripts/check_diverse_upstreams.py \
            --run-openssl \
            --output-root "$RUNNER_TEMP/openssl-pqc"
          python scripts/check_diverse_upstreams.py \
            --validate-result \
            "$RUNNER_TEMP/openssl-pqc/openssl-pqc-api.json"
      - name: Upload exact source and integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: openssl-pqc-api-${{ github.sha }}
          path: |
            ${{ runner.temp }}/openssl-pqc/openssl-pqc-api.json
            ${{ runner.temp }}/openssl-pqc/openssl-3.5.7.tar.gz
            ${{ runner.temp }}/openssl-pqc/adapter-*/openssl-pqc-smoke
          if-no-files-found: error

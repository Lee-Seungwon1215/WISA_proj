project:
  name: mldsa_native_65_x86_64
  language: c
  root: ..

build: {argv: ["true"], workdir: .}

dudect:
  enabled: true
  backend: official-dudect
  measurements: 1000
  warmup: 50
  batches: 10
  clock: auto
  seed: 0xC0FFEE
  generated_dir: ./_generated_dudect_x86_64
  compiler:
    cc: gcc
    cflags: [-std=c99, -O2, -g, -fno-omit-frame-pointer, -fno-lto,
             -DMLD_CONFIG_PARAMETER_SET=65,
             -DMLD_CONFIG_USE_NATIVE_BACKEND_ARITH,
             -DMLD_CONFIG_USE_NATIVE_BACKEND_FIPS202,
             -DMLD_FORCE_X86_64, -mavx2, -mbmi2]
  harnesses:
    - name: sign
      template: sign
      header: timing_api.h
      randombytes_header: src/randombytes.h
      prefix: "CTKAT_MLDSA_"
      include_dirs: [., upstream/mldsa]
      sources:
        - timing_adapter.c
        - upstream/mldsa/mldsa_native.c
        - upstream/mldsa/mldsa_native_asm.S

report: {output_dir: ./reports_timing_x86_64}

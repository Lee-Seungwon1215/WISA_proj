project:
  name: pqcrystals_kyber768_ref_a621b8d
  language: c
  root: .

build:
  argv: ["true"]
  workdir: .

ct:
  workdir: .
  generated_dir: ./_generated
  cflags: [-O0, -g, -fno-inline, -fno-omit-frame-pointer, -DKYBER_K=3]
  harnesses:
    - name: kem_dec
      template: kem
      header: ctkat_api.h
      extra_headers: [params.h]
      prefix: "pqcrystals_kyber768_ref_"
      secret_regions:
        - {offset: "0", length: "KYBER_INDCPA_SECRETKEYBYTES",
           comment: "historical Kyber IND-CPA secret polynomial s"}
        - {offset: "KYBER_SECRETKEYBYTES - KYBER_SYMBYTES", length: "KYBER_SYMBYTES",
           comment: "historical Kyber FO rejection seed z"}
      include_dirs: [., ref]
      sources:
        - ref/kem.c
        - ref/indcpa.c
        - ref/poly.c
        - ref/polyvec.c
        - ref/ntt.c
        - ref/reduce.c
        - ref/cbd.c
        - ref/symmetric-shake.c
        - ref/verify.c
        - ref/fips202.c
        - ref/randombytes.c

report:
  output_dir: ./reports

matrix:
  compilers: [gcc, clang]
  ct_cflags:
    debug:   [-O0, -g, -fno-inline, -fno-omit-frame-pointer, -DKYBER_K=3]
    opt1:    [-O1, -g, -fno-omit-frame-pointer, -fno-lto, -DKYBER_K=3]
    release: [-O2, -g, -fno-omit-frame-pointer, -fno-lto, -DKYBER_K=3]
    opt3:    [-O3, -g, -fno-omit-frame-pointer, -fno-lto, -DKYBER_K=3]
    size:    [-Os, -g, -fno-omit-frame-pointer, -fno-lto, -DKYBER_K=3]

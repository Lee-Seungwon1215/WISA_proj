project:
  name: toy_kem_ct_leak
  language: c
  root: .

build:
  # Source is compiled in by each analysis harness.
  argv: ["true"]
  workdir: .

# The same `dec(ct, sk)` workload is also used by the TIMECOP and MicroWalk
# baseline adapters.  Here `ct` is deliberately tainted: this toy benchmark
# models input-dependent execution, not a claim that a real KEM ciphertext is
# secret.
ct:
  workdir: .
  generated_dir: ./_generated
  cflags: [-O2, -g, -fno-inline, -fno-omit-frame-pointer, -fno-lto]
  harnesses:
    - name: leaky
      template: generic
      extra_headers: [toy_kem.h]
      include_dirs: [include]
      sources: [src/toy_kem.c]
      function: LEAKY_crypto_kem_dec
      return_type: int
      args: [ss, ct, sk]
      buffers:
        - {name: ss, size: "LEAKY_CRYPTO_BYTES", role: output}
        - {name: ct, size: "LEAKY_CRYPTO_CIPHERTEXTBYTES", role: secret}
        - {name: sk, size: "LEAKY_CRYPTO_SECRETKEYBYTES", role: public}

    - name: safe
      template: generic
      extra_headers: [toy_kem.h]
      include_dirs: [include]
      sources: [src/toy_kem.c]
      function: SAFE_crypto_kem_dec
      return_type: int
      args: [ss, ct, sk]
      buffers:
        - {name: ss, size: "SAFE_CRYPTO_BYTES", role: output}
        - {name: ct, size: "SAFE_CRYPTO_CIPHERTEXTBYTES", role: secret}
        - {name: sk, size: "SAFE_CRYPTO_SECRETKEYBYTES", role: public}

dudect:
  enabled: true
  backend: official-dudect
  measurements: 50000
  warmup: 500
  batches: 10
  # Resolves to RDTSCP on the frozen Linux/x86_64 native profile and to
  # monotonic elsewhere. Non-native output is retained but never promoted.
  clock: auto
  seed: 0xC0FFEE
  workdir: .
  generated_dir: ./_generated_dudect
  compiler:
    cc: gcc
    cflags: [-O2, -g, -fno-omit-frame-pointer, -fno-lto]
  harnesses:
    # leaky: ct[0]-dependent slow path in LEAKY_crypto_kem_dec().
    # Expected: FAIL.
    - name: leaky
      template: kem
      leak_target: ct
      include_dirs: [include]
      sources: [src/toy_kem.c]
      header: toy_kem.h
      randombytes_header: null
      prefix: "LEAKY_"

    # safe: same loop count for every ct in SAFE_crypto_kem_dec().
    # Expected: PASS.
    - name: safe
      template: kem
      leak_target: ct
      include_dirs: [include]
      sources: [src/toy_kem.c]
      header: toy_kem.h
      randombytes_header: null
      prefix: "SAFE_"

report:
  output_dir: ./reports

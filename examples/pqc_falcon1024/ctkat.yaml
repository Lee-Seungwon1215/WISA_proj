project:
  name: pqclean_falcon1024_reference
  language: c
  root: ..

build:
  argv: ["true"]
  workdir: .

# PQClean Falcon-1024 reference-family signing target.
# sk[0] is the public format header; sk[1..2304] encodes f, g, and F.
ct:
  workdir: .
  generated_dir: ./_generated
  compile_timeout: 900
  valgrind_timeout: 1200
  cflags: [-std=c99, -O0, -g, -fno-inline, -fno-omit-frame-pointer]
  harnesses:
    - name: sign
      template: sign
      header: api.h
      prefix: "PQCLEAN_FALCON1024_CLEAN_"
      secret_regions:
        - {offset: "1", length: "PQCLEAN_FALCON1024_CLEAN_CRYPTO_SECRETKEYBYTES - 1",
           comment: "encoded private f, g, F; sk[0] is public format header"}
      include_dirs:
        - clean
        - ../pqc_mlkem768/common
      sources:
        - clean/codec.c
        - clean/common.c
        - clean/fft.c
        - clean/fpr.c
        - clean/keygen.c
        - clean/pqclean.c
        - clean/rng.c
        - clean/sign.c
        - clean/vrfy.c
        - ../pqc_mlkem768/common/fips202.c
        - ../falcon_comparator_support/deterministic_randombytes.c

report:
  output_dir: ./reports

matrix:
  compilers: [gcc, clang]
  ct_cflags:
    debug: [-std=c99, -O0, -g, -fno-inline, -fno-omit-frame-pointer]
    release: [-std=c99, -O2, -g, -fno-omit-frame-pointer, -fno-lto]

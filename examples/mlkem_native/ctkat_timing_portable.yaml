project:
  name: mlkem_native_768_portable
  language: c
  root: ..

build: {argv: ["true"], workdir: .}

dudect:
  enabled: true
  backend: official-dudect
  measurements: 10000
  warmup: 200
  batches: 10
  clock: auto
  seed: 0xC0FFEE
  generated_dir: ./_generated_dudect_portable
  compiler:
    cc: gcc
    cflags: [-std=c99, -O2, -g, -fno-omit-frame-pointer, -fno-lto,
             -DMLK_CONFIG_PARAMETER_SET=768]
  harnesses:
    - name: kem_dec
      template: kem
      header: mlkem_native.h
      randombytes_header: src/randombytes.h
      prefix: ""
      include_dirs: [upstream/mlkem]
      sources: [upstream/mlkem/mlkem_native.c]

report: {output_dir: ./reports_timing_portable}

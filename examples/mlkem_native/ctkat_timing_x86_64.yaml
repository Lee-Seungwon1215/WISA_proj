project:
  name: mlkem_native_768_x86_64
  language: c
  root: ..

build: {argv: ["true"], workdir: .}

dudect:
  enabled: true
  backend: official-dudect
  measurements: 10000
  warmup: 200
  batches: 10
  clock: auto
  seed: 0xC0FFEE
  generated_dir: ./_generated_dudect_x86_64
  compiler:
    cc: gcc
    cflags: [-std=c99, -O2, -g, -fno-omit-frame-pointer, -fno-lto,
             -DMLK_CONFIG_PARAMETER_SET=768,
             -DMLK_CONFIG_USE_NATIVE_BACKEND_ARITH,
             -DMLK_CONFIG_USE_NATIVE_BACKEND_FIPS202,
             -DMLK_FORCE_X86_64, -mavx2, -mbmi2]
  harnesses:
    - name: kem_dec
      template: kem
      header: mlkem_native.h
      randombytes_header: src/randombytes.h
      prefix: ""
      include_dirs: [upstream/mlkem]
      sources:
        - upstream/mlkem/mlkem_native.c
        - upstream/mlkem/mlkem_native_asm.S

report: {output_dir: ./reports_timing_x86_64}

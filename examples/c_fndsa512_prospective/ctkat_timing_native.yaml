project:
  name: c_fndsa512_native_fp
  language: c
  root: ..

build: {argv: ["true"], workdir: .}

dudect:
  enabled: true
  backend: official-dudect
  measurements: 1000
  warmup: 50
  batches: 10
  clock: auto
  seed: 0xC0FFEE
  generated_dir: ./_generated_dudect_native
  compiler:
    cc: gcc
    cflags: &native_flags
      [-std=c99, -O2, -g, -fno-omit-frame-pointer, -fno-lto,
       -D_GNU_SOURCE, -DCTKAT_FNDSA_LOGN=9, -DFNDSA_AVX2=0]
  harnesses:
    - name: sign
      template: sign
      header: api.h
      randombytes_header: null
      prefix: "CTKAT_FNDSA_"
      include_dirs: [., ../fndsa_prospective/upstream]
      sources: &fndsa_sources
        - ../fndsa_prospective/timing_adapter.c
        - ../fndsa_prospective/upstream/codec.c
        - ../fndsa_prospective/upstream/mq.c
        - ../fndsa_prospective/upstream/sha3.c
        - ../fndsa_prospective/upstream/sysrng.c
        - ../fndsa_prospective/upstream/util.c
        - ../fndsa_prospective/upstream/kgen.c
        - ../fndsa_prospective/upstream/kgen_fxp.c
        - ../fndsa_prospective/upstream/kgen_gauss.c
        - ../fndsa_prospective/upstream/kgen_mp31.c
        - ../fndsa_prospective/upstream/kgen_ntru.c
        - ../fndsa_prospective/upstream/kgen_poly.c
        - ../fndsa_prospective/upstream/kgen_zint31.c
        - ../fndsa_prospective/upstream/sign.c
        - ../fndsa_prospective/upstream/sign_core.c
        - ../fndsa_prospective/upstream/sign_fpoly.c
        - ../fndsa_prospective/upstream/sign_fpr.c
        - ../fndsa_prospective/upstream/sign_sampler.c
        - ../fndsa_prospective/upstream/vrfy.c

report: {output_dir: ./reports_timing_native}
